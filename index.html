      h('p', {}, `${TRN.reeks.keys.length === 12 ? 'Alle twaalf toonsoorten' : TRN.reeks.keys.length + ' toonsoorten'}` + (res.mediaan_s != null ? ` · gemiddeld ${String(res.mediaan_s).replace('.', ',')} s per greep` : '')),
      res.traag.length ? h('p', { id: 'trSlow' }, 'Traag: ', res.traag.map(x => x.akkoord + ' in ' + x.toonsoort).join(', ')) : h('p', {}, 'Geen akkoord ging duidelijk trager dan de rest.')),
    h('div', { class: 'tr-actions' },
      h('button', { type: 'button', class: 'btn brass', id: 'trAgain', onclick: () => { TRN.roundDone = false; TRN.i = 0; trainerShow(); } }, 'Nog een ronde'),
      h('button', { type: 'button', class: 'btn', id: 'trStop', onclick: trainerStop }, trainerStopLabel())));
}
function trainerTick() {
  const c = $('#trClock'); if (!c || !TRN.on) return;
  const b = RUN.active && curBlock();
  if (!b || b.kind !== 'trainer') { c.textContent = ''; return; }
  const sec = (performance.now() - RUN.blockStart) / 1000;
  if (b.open) { c.textContent = fmtClock(sec); return; }
  const left = b.minutes * 60 - sec;
  c.textContent = left > 0 ? 'nog ' + fmtClock(Math.ceil(left)) : 'tijd is om';
  c.classList.toggle('over', left <= 0);
}
// Een greep goed (via MIDI) of doorgetikt: tijd vastleggen, even groen, dan het volgende akkoord.
function trainerHit(via) {
  const s = TRN.steps[TRN.i]; if (!s || TRN.okT || TRN.roundDone) return;
  TRN.hits.push({ key: s.key, label: s.chord.label, ms: Math.round(performance.now() - TRN.shownAt), mis: TRN.mis, via });
  trainerKeep();
  if (via === 'tik') { trainerAdvance(); return; }
  trainerDraw();
  TRN.okT = setTimeout(() => { TRN.okT = null; trainerAdvance(); }, TRAINER_OK_MS);
}
function trainerSkip() {
  const s = TRN.steps[TRN.i]; if (!s || TRN.okT) return;
  TRN.hits.push({ key: s.key, label: s.chord.label, skip: true });
  trainerKeep(); trainerAdvance();
}
function trainerAdvance() {
  TRN.i++;
  if (TRN.i >= TRN.steps.length) { TRN.rounds++; TRN.roundDone = true; trainerKeep(); trainerDraw(); return; }
  trainerShow();
}
// De uitslag tot nu in het blok, zodat de tussenstand (runDraft) hem ook heeft.
function trainerKeep() {
  const r = RUN.active && RUN.results[TRN.runIdx]; if (!r) return;
  r.trainer = trainerResult(TRN.reeks, TRN.hits, TRN.rounds);
  r.trainerHits = TRN.hits.slice(); r.trainerRounds = TRN.rounds;   // alleen voor de tussenstand; het sessiebestand krijgt de uitslag
  saveDraft();
}
function trainerStop() {
  if (!TRN.on) return;
  trainerKeep();
  closeTrainerEl();
  if (RUN.active) runNext(false);
}
function closeTrainerEl() {
  clearTimeout(TRN.okT); TRN.okT = null; clearInterval(TRN.tick); TRN.tick = null;
  TRN.on = false; if (TRN.el) TRN.el.remove(); TRN.el = null;
}
function trainerMidi(m) {
  if (!TRN.on || TRN.roundDone || (m.kind !== 'on' && m.kind !== 'off')) return;
  if (m.kind === 'on') TRN.held.add(m.n); else TRN.held.delete(m.n);
  const s = TRN.steps[TRN.i]; if (!s) return;
  if (!TRN.held.size) TRN.armed = true;
  if (TRN.okT) return;
  const held = [...TRN.held];
  if (m.kind === 'on') TRN.played = held.sort((a, b) => a - b).map(n => noteName(n).replace(/-?\d+$/, '').replace('#', '♯')).join(' ');
  if (gripOk(held, s.chord) && topOk(held, s.chord)) { trainerHit('midi'); return; }
  if (m.kind === 'on' && TRN.armed && held.length >= trainerNeed(s.chord)) { TRN.mis++; TRN.armed = false; }
  const k = $('#trKeys'); if (k) fill(k, keysSvg(s.chord, { held, next: (TRN.steps[TRN.i + 1] || {}).chord || null }));
  const msg = $('#trMsg'); if (msg) msg.textContent = TRN.played ? 'Je speelt ' + TRN.played : 'Speel de greep; de ligging is vrij.';
}
midiIn.on(m => trainerMidi(m));
async function boot() {
  $('#settingsBtn').append(icon('sliders'));
  $('#reportBtn').append(icon('flag'));
  $('#reportBtn').addEventListener('click', () => reportDialog());
  $('#settingsBtn').addEventListener('click', openSettings);
  $('#midiChip').addEventListener('click', () => { if (midi.status === 'on') openSettings(); else if (midi.status === 'blocked' && IN_ARTIFACT) midiHelp(); else midiConnect(true); });
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  $('#fileIn').addEventListener('change', e => { const f = [...e.target.files]; e.target.value = ''; addFiles(f); });
  $('#backupIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); });
  let dragN = 0, dropEl = null;
  const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  window.addEventListener('dragenter', e => { if (!hasFiles(e) || R.open) return; dragN++; if (!dropEl) { dropEl = h('div', { class: 'drop' }, h('div', {}, 'Laat los om toe te voegen')); document.body.append(dropEl); } });
  window.addEventListener('dragleave', () => { if (--dragN <= 0 && dropEl) { dropEl.remove(); dropEl = null; dragN = 0; } });
  window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); dragN = 0; if (dropEl) { dropEl.remove(); dropEl = null; } if (!R.open) addFiles([...e.dataTransfer.files]); });
  wireReader(); updateMidiChip();

  $('#main').replaceChildren(h('p', { class: 'note' }, 'Bibliotheek openen…'));
  READ_ONLY = !IN_ARTIFACT && await decideReadOnly();
  if (READ_ONLY) $('#main').before(h('div', { class: 'ro-banner', role: 'status', id: 'roBanner' },
    h('b', {}, 'Alleen lezen: '), 'hier bewaart Lessenaar niets. Oefenen en bewaren doe je in de Lessenaar-app op je iPad (of in MIDIWeb Browser).'));
  store = await pickStore();
  store.on(() => queueRender());
  if (!READ_ONLY && store.kind === 'local') askPersist();
  // Eenmalig (26 okt): werktempo's kwamen uit schattingen van losse flarden (bv. ♩140, ♩25). Weg ermee; de
  // metronoom gaat voortaan alleen aan op een tempo dat jij of de coach kiest.
  if (!READ_ONLY && !LS.get('tempoReset', false) && store.canUpload) {
    let n = 0;
    for (const p of allPieces()) if (!p.example && (p.sections || []).some(x => x.tempo)) { savePiece({ ...p, sections: p.sections.map(x => ({ ...x, tempo: null })) }); n++; }
    LS.set('tempoReset', true);
    if (n) toast('De geschatte werktempo’s zijn gewist: ze klopten niet. De metronoom gaat alleen nog aan op een tempo dat jij of je coach kiest.', { sticky: true });
  }
  const settled = settleDraft(false);
  if (settled) toast('Je sessie van ' + relDay(settled.startedAt) + ' was niet afgesloten. Lessenaar heeft bewaard wat je speelde.');
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && RUN.active) saveDraft(); });
  window.addEventListener('pagehide', () => { if (RUN.active) saveDraft(); });
  const v = location.hash.slice(1);
  setView(['today', 'library', 'lists', 'log'].includes(v) ? v : 'today');
  if (LS.get('midiAuto', false) && !IN_ARTIFACT) setTimeout(() => midiConnect(false), 300);
  else if (!IN_ARTIFACT) setTimeout(() => { if (!midiIn.available() && midi.status === 'off') midiIn.setStatus('unsupported'); }, Math.max(0, MIDI_WAIT_MS - performance.now()));
  ensurePdfJs().catch(e => toast('pdf.js kon niet laden (' + e.message + '). Controleer je internetverbinding.', { sticky: true }));
  if (syncCfg()) setTimeout(() => syncNow(), 800);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && syncCfg() && Date.now() - (SYNC.last || 0) > 60e3) syncNow(); });
  window.addEventListener('online', () => { if (syncCfg()) syncNow(); });
  try { selftestBoot(); } catch (e) { console.warn('zelftest', e); }   // #160: na 3 s, nooit in de weg van het opstarten
}
boot();
</script>
