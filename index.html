<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Lessenaar"><meta name="theme-color" content="#16181A"><script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});</script></head><body><title>Lessenaar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..600&display=swap">
<style>
/* Layout: een lessenaar. Ebbenhouten frame, papier in het midden. Bibliotheek = plank met partituren; lezer = volledig podium. */
:root {
  --bg: #ECEDEA;
  --surface: #F8F8F6;
  --surface-2: #E2E4E0;
  --ink: #16181A;
  --muted: #586066;
  --line: #CFD3CE;
  --accent: #85631A;
  --accent-weak: #EBE1C8;
  --on-accent: #FFFFFF;
  --bar: #9A7420;
  --paper: #FFFFFF;
  --stage: #1C1E20;
  --stage-2: #2B2E31;
  --stage-ink: #ECEAE5;
  --stage-muted: #A5A9AD;
  --brass: #C9A24A;
  --ok: #2E7A4D;
  --warn: #9A5D12;
  --info: #2D5B96;
  --danger: #A3322A;
  --shadow: 0 1px 2px rgba(20, 22, 24, .07), 0 8px 22px rgba(20, 22, 24, .09);
  --font-display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
  --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121314; --surface: #1A1C1E; --surface-2: #25282B; --ink: #ECEAE5; --muted: #9CA1A5;
    --line: #2F3337; --accent: #C9A24A; --accent-weak: #3A3220; --on-accent: #17140B; --bar: #B08A35;
    --paper: #FFFFFF; --stage: #0D0E0F; --stage-2: #222528; --stage-ink: #ECEAE5; --stage-muted: #A5A9AD;
    --brass: #C9A24A; --ok: #63B585; --warn: #DDA04B; --info: #86AEE3; --danger: #E27A70;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 26px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121314; --surface: #1A1C1E; --surface-2: #25282B; --ink: #ECEAE5; --muted: #9CA1A5;
  --line: #2F3337; --accent: #C9A24A; --accent-weak: #3A3220; --on-accent: #17140B; --bar: #B08A35;
  --paper: #FFFFFF; --stage: #0D0E0F; --stage-2: #222528; --stage-ink: #ECEAE5; --stage-muted: #A5A9AD;
  --brass: #C9A24A; --ok: #63B585; --warn: #DDA04B; --info: #86AEE3; --danger: #E27A70;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 26px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* ---------- top ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding: 12px clamp(16px, 4vw, 40px); max-width: 1320px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.wordmark { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 28px; letter-spacing: -.01em; line-height: 1; }
.brand-sub { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 999px; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 500; font-size: 14px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.top-actions { display: flex; gap: 8px; align-items: center; }

.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.dot.err { background: var(--warn); }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; border: 1px solid transparent; background: transparent; }
.icon-btn:hover { background: var(--surface-2); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; font-weight: 500; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.brass { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
svg.i { width: 18px; height: 18px; flex: none; }

/* ---------- main ---------- */
.wrap { padding-inline: clamp(16px, 4vw, 40px); padding-block: 24px 64px; max-width: 1320px; margin: 0 auto; }
.view-head { display: flex; flex-wrap: wrap; align-items: end; gap: 16px; justify-content: space-between; margin-bottom: 18px; }
.view-head h1 { font-family: var(--font-display); font-weight: 500; font-size: clamp(30px, 4vw, 42px); letter-spacing: -.015em; line-height: 1.05; }
.sub { color: var(--muted); margin: 6px 0 0; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0 10px; min-width: 0; }
.search input { border: 0; background: transparent; padding: 8px 0; width: 180px; max-width: 46vw; outline: none; }
select.sel { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.filters button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 28px 22px; }
.card { position: relative; display: flex; flex-direction: column; gap: 10px; cursor: pointer; border-radius: 6px; outline-offset: 6px; min-width: 0; }
.cover { aspect-ratio: 1 / 1.414; max-width: 100%; background: var(--paper); border-radius: 3px; box-shadow: var(--shadow); overflow: hidden; position: relative; transition: transform .18s ease, box-shadow .18s ease; }
.card:hover .cover { transform: translateY(-3px); }
.cover img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.cover .ph { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 16px; color: #2a2a2a; font-family: var(--font-display); font-size: 18px; line-height: 1.15; }
.cover .ph small { display: block; font-family: var(--font-ui); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #777; margin-top: 8px; }
.ribbon { position: absolute; bottom: 12px; left: 0; background: var(--accent); color: var(--on-accent); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px 3px 10px; font-weight: 600; }
.card-title { font-family: var(--font-display); font-weight: 500; font-size: 19px; line-height: 1.15; overflow-wrap: anywhere; }
.card-comp { color: var(--muted); font-size: 13px; margin: 2px 0 0; overflow-wrap: anywhere; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.card-more { position: absolute; top: 6px; right: 6px; background: color-mix(in srgb, var(--paper) 88%, transparent); color: #222; width: 30px; height: 30px; border-radius: 8px; opacity: 0; transition: opacity .15s; }
.card:hover .card-more, .card:focus-within .card-more, .card-more:focus-visible { opacity: 1; }
@media (hover: none) { .card-more { opacity: 1; } }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--ink); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.nieuw { color: var(--muted); }
.pill.instuderen { color: var(--info); }
.pill.bijschaven { color: var(--warn); }
.pill.repertoire { color: var(--ok); }
.pill.actief { color: var(--info); }
.pill.onderhoud { color: var(--ok); }
.pill.geparkeerd { color: var(--muted); }
.badge-focus { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--accent); }

.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 36px 24px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty h2 { font-family: var(--font-display); font-weight: 500; font-size: 24px; color: var(--ink); }
.empty p { max-width: 52ch; margin: 0; }

.drop { position: fixed; inset: 0; z-index: 80; background: color-mix(in srgb, var(--bg) 80%, transparent); display: grid; place-items: center; pointer-events: none; }
.drop div { border: 2px dashed var(--accent); border-radius: 18px; padding: 40px 56px; font-family: var(--font-display); font-size: 26px; background: var(--surface); }

/* lists */
.lists { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.list-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.list-card h3 { font-family: var(--font-display); font-weight: 500; font-size: 22px; }
.list-card ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.list-card li { overflow-wrap: anywhere; }
.list-card li span { color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* log */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.tile .k { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tile .v { font-family: var(--font-mono); font-size: 28px; font-weight: 500; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .h { font-size: 13px; color: var(--muted); margin-top: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 18px; min-width: 0; }
.panel h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.panel h2 span { color: var(--muted); font-weight: 400; }
.chart { position: relative; }
.chart svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); }
.bars-list { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 2fr) auto; gap: 10px 12px; align-items: center; }
.bl-row { display: contents; }
.bl-row .num { text-align: right; }
.bl-row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bl-track { height: 10px; background: var(--surface-2); border-radius: 0 4px 4px 0; overflow: hidden; }
.bl-fill { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
td.num, th.num { text-align: right; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 820px) { .two { grid-template-columns: minmax(0, 1fr); } }

/* dialog */
dialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--surface); color: var(--ink); width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 24px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10, 11, 12, .45); }
.dlg { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 10px; }
.dlg-head h2 { font-family: var(--font-display); font-weight: 500; font-size: 24px; }
.dlg-body { padding: 4px 18px 16px; overflow: auto; display: grid; gap: 14px; }
.dlg-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.dlg-foot .left { margin-right: auto; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .fields { grid-template-columns: minmax(0, 1fr); } }
.field { display: grid; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label, .lbl { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.field input, .field select, .sec-row input, .it-row select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.sec-table { display: grid; gap: 6px; }
.sec-row { display: grid; grid-template-columns: minmax(0, 2.2fr) 60px minmax(0, 1fr) 64px 56px 32px; gap: 6px; align-items: center; }
.sec-row.head { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
@media (max-width: 560px) { .sec-row { grid-template-columns: minmax(0, 1fr) 52px 60px 32px; } .sec-row .bars, .sec-row .step { display: none; } }
.it-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.set-group { display: grid; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.set-group:last-child { border-bottom: 0; }
.set-group h3 { font-size: 14px; font-weight: 600; }
.set-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; justify-content: space-between; }
.set-line .what { min-width: 0; }
.kbd { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; background: var(--bg); }
.note { font-size: 13px; color: var(--muted); }
.learning { color: var(--accent); font-weight: 600; }

.toasts { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); z-index: 120; display: grid; gap: 8px; width: min(520px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--bg); border-radius: 12px; padding: 11px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; gap: 10px; align-items: center; font-size: 14px; }
.toast .msg { flex: 1; min-width: 0; }
.toast button { background: transparent; border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); color: var(--bg); border-radius: 8px; padding: 4px 10px; font-size: 13px; }

/* ---------- reader ---------- */
.reader { position: fixed; inset: 0; z-index: 50; background: var(--stage); color: var(--stage-ink); overflow: hidden; user-select: none; -webkit-user-select: none; }
.stage { position: absolute; inset: 0; display: grid; place-items: center; touch-action: none; }
.spread { display: flex; gap: 8px; align-items: center; justify-content: center; }
.slot { position: relative; }
.sheet { position: relative; background: var(--paper); box-shadow: 0 2px 30px rgba(0, 0, 0, .5); }
.sheet canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sheet canvas.ink { mix-blend-mode: multiply; }
.reader.annot .sheet canvas.ink { cursor: crosshair; }
.reader.night .sheet { filter: invert(.9) hue-rotate(180deg); }
.slot.half .sheet { position: absolute; top: 0; left: 0; }
.slot.half .sheet.top { clip-path: inset(0 0 50% 0); z-index: 2; }
.slot.half .sheet.bottom { clip-path: inset(50% 0 0 0); }
.half-line { position: absolute; left: -10px; right: -10px; top: 50%; height: 2px; background: var(--brass); z-index: 3; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.half-line span { position: absolute; right: 12px; top: -22px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; background: var(--brass); color: #17140B; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
.stage-msg { max-width: 420px; text-align: center; display: grid; gap: 12px; justify-items: center; padding: 24px; color: var(--stage-muted); }
.stage-msg h2 { font-family: var(--font-display); color: var(--stage-ink); font-weight: 500; }

.rbar { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px; background: rgba(13, 14, 15, .9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,.07); transition: transform .22s ease, opacity .22s ease; }
.reader.bars-hidden .rbar { transform: translateY(-105%); opacity: 0; pointer-events: none; }
.rbtn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--stage-ink); font-size: 14px; white-space: nowrap; }
.rbtn:hover { background: var(--stage-2); }
.rbtn[aria-pressed="true"] { background: var(--stage-2); border-color: color-mix(in srgb, var(--brass) 60%, transparent); color: var(--brass); }
.rtitle { min-width: 0; flex: 1 1 200px; display: grid; line-height: 1.2; }
.rtitle b { font-family: var(--font-display); font-weight: 500; font-size: 19px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rtitle span { font-size: 12.5px; color: var(--stage-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rpage { font-family: var(--font-mono); font-size: 14px; color: var(--stage-muted); padding: 0 6px; }
.rtools { display: flex; gap: 2px; align-items: center; flex-wrap: wrap; }
.timer { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13.5px; }
.timer .played { color: var(--brass); }
.timer.paused { color: var(--stage-muted); text-decoration: line-through; }
.inkbar { position: absolute; z-index: 6; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); transform: translateX(-50%); display: flex; gap: 4px; align-items: center; background: rgba(13, 14, 15, .94); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 6px; max-width: calc(100vw - 24px); flex-wrap: wrap; justify-content: center; }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); }
.ink-tool[aria-pressed="true"] .swatch { border-color: var(--brass); }
.flash { position: absolute; top: 0; bottom: 0; width: 6px; background: var(--brass); opacity: 0; z-index: 4; pointer-events: none; transition: opacity .4s; }
.flash.r { right: 0; } .flash.l { left: 0; }
.flash.on { opacity: .8; transition: none; }
.folio { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); left: 50%; transform: translateX(-50%); z-index: 4; background: rgba(13,14,15,.82); color: var(--stage-ink); font-family: var(--font-mono); font-size: 13px; padding: 4px 10px; border-radius: 999px; opacity: 0; transition: opacity .5s; pointer-events: none; }
.folio.on { opacity: 1; transition: none; }

.pop { position: absolute; z-index: 7; top: calc(env(safe-area-inset-top, 0px) + 60px); right: 12px; width: min(380px, calc(100vw - 24px)); max-height: calc(100vh - 90px); overflow: auto; background: #17191B; color: var(--stage-ink); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.5); display: grid; gap: 12px; }

const COLLS = ['pieces', 'setlists', 'sessions', 'annotations', 'runs', 'meta'];

class BaseStore {
  constructor() {
    this.data = Object.fromEntries(COLLS.map(c => [c, new Map()]));
    this.listeners = new Set(); this.pending = new Map(); this.inflight = new Map();
    this.downloads = null; this.canUpload = true;
  }
  on(fn) { this.listeners.add(fn); }
  emit(coll) { for (const fn of this.listeners) fn(coll); }
  all(coll) { return [...this.data[coll].values()]; }
  get(coll, id) { return this.data[coll].get(id); }
  // Hoogstens één schrijfactie per document onderweg; de laatste versie wint.
  save(coll, id, body) {
    const key = coll + '/' + id;
    const doc = { ...body }; delete doc.id;
    this.data[coll].set(id, { ...doc, id });
    this.emit(coll);
    this.pending.set(key, { coll, id, doc });
    if (!this.inflight.has(key)) {
      const job = (async () => {
        while (this.pending.has(key)) {
          const j = this.pending.get(key); this.pending.delete(key);
          try { await this._write(j.coll, j.id, j.doc); }
          catch (e) { reportStoreError(e); }
        }
        this.inflight.delete(key);
      })();
      this.inflight.set(key, job);
    }
    return this.inflight.get(key);
  }
  async remove(coll, id) {
    const key = coll + '/' + id;
    this.pending.delete(key);
    if (this.inflight.has(key)) await this.inflight.get(key);
    this.data[coll].delete(id); this.emit(coll);
    try { await this._delete(coll, id); } catch (e) { reportStoreError(e); }
  }
  async builtinBytes(ref) {
    const r = await fetch(ref.path);
    if (!r.ok) throw new Error('Voorbeeldbestand niet gevonden (' + r.status + ')');
    return r.arrayBuffer();
  }
}

class ClaudeStore extends BaseStore {
  constructor(db, assets, downloads) {
    super(); this.kind = 'claude'; this.db = db; this.assets = assets; this.downloads = downloads; this.canUpload = !!assets;
  }
  init() {
    return Promise.all(COLLS.map(c => new Promise(resolve => {
      let first = true;
      const done = () => { if (first) { first = false; resolve(); } };
      setTimeout(done, 8000);
      this.db.collection(c).onSnapshot(snap => {
        const m = new Map();
        for (const d of snap.docs) m.set(d.id, { ...d.data(), id: d.id });
        for (const [key, j] of this.pending) if (j.coll === c) m.set(j.id, { ...j.doc, id: j.id });
        this.data[c] = m; this.emit(c); done();
      }, err => { console.warn('db', c, err); done(); if (err && err.code !== 'revoked') toast('Bibliotheek kon niet synchroniseren (' + (err.code || 'fout') + '). Herlaad de pagina.'); });
    })));
  }
  _write(c, id, doc) { return this.db.collection(c).doc(id).set(doc); }
  _delete(c, id) { return this.db.collection(c).doc(id).delete(); }
  async putFile(file) {
    const r = await this.assets.upload(file, { type: 'application/pdf' });
    return { kind: 'asset', id: r.id };
  }
  async fileBytes(ref) {
    if (ref.kind === 'builtin') return this.builtinBytes(ref);
    const r = await fetch('/_blob/' + ref.id);
    if (!r.ok) throw new Error('PDF niet gevonden (' + r.status + ')');
    return r.arrayBuffer();
  }
  async delFile(ref) { if (ref && ref.kind === 'asset' && this.assets) { try { await this.assets.delete(ref.id); } catch (e) { console.warn(e); } } }
  describe() { return 'Je bibliotheek staat in claude.ai, bij dit artefact. Je ziet hem op elk apparaat waarop je bent ingelogd.'; }
}

class LocalStore extends BaseStore {
  constructor() { super(); this.kind = 'local'; this.mem = new Map(); this.idb = null; }
  async init() {
    try {
      this.idb = await new Promise((res, rej) => {
        const r = indexedDB.open('lessenaar', 2);
        r.onupgradeneeded = () => { for (const c of [...COLLS, 'files']) if (!r.result.objectStoreNames.contains(c)) r.result.createObjectStore(c, { keyPath: 'id' }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      });
      // Een nieuwere versie van Lessenaar (andere tab) wil upgraden: verbinding vrijgeven.
      this.idb.onversionchange = () => { this.idb.close(); toast('Lessenaar is bijgewerkt in een ander venster. Herlaad deze pagina.', { sticky: true }); };
      for (const c of COLLS) {
        const rows = await this._tx(c, 'readonly', s => s.getAll());
        this.data[c] = new Map(rows.map(r => [r.id, r]));
      }
    } catch (e) {
      console.warn('IndexedDB niet beschikbaar', e); this.idb = null;
      toast('Deze browser bewaart niets (privévenster?). Wat je nu toevoegt, is weg na herladen.', { sticky: true });
    }
  }
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.idb.transaction(store, mode); const req = fn(tx.objectStore(store));
      tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  }
  async _write(c, id, doc) { if (this.idb) await this._tx(c, 'readwrite', s => s.put({ ...doc, id })); }
  async _delete(c, id) { if (this.idb) await this._tx(c, 'readwrite', s => s.delete(id)); }
  async putFile(file) {
    const id = uid(), buf = await file.arrayBuffer();
    if (this.idb) await this._tx('files', 'readwrite', s => s.put({ id, name: file.name, data: buf }));
    else this.mem.set(id, buf);
    return { kind: 'local', id };
  }
  async fileBytes(ref) {
    if (ref.kind === 'builtin') return this.builtinBytes(ref);
    if (!this.idb) { const b = this.mem.get(ref.id); if (!b) throw new Error('PDF niet gevonden'); return b.slice(0); }
    const row = await this._tx('files', 'readonly', s => s.get(ref.id));
    if (!row) throw new Error('PDF niet gevonden in deze browser');
    return row.data instanceof Blob ? row.data.arrayBuffer() : row.data;
  }
  async delFile(ref) { if (ref && ref.kind === 'local') { this.mem.delete(ref.id); if (this.idb) await this._tx('files', 'readwrite', s => s.delete(ref.id)); } }
  describe() { return this.idb ? 'Je bibliotheek staat lokaal in deze browser (IndexedDB). Maak af en toe een back-up: browsers kunnen sitegegevens wissen.' : 'Deze browser bewaart niets; alles verdwijnt bij herladen.'; }
}

function sectionForPage(p, page, preferId, pageCount) {
  const s = sortedSections(p);

// bibliotheek hoeft bij openen geen enkele PDF te laden.
async function renderThumb(doc, first = 1) {
  const page = await doc.getPage(Math.min(doc.numPages, Math.max(1, first || 1)));
  const vp1 = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: 300 / vp1.width });
  const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);

async function addFiles(files) {
  if (!store.canUpload) { toast('Alleen de eigenaar van deze bibliotheek kan stukken toevoegen.'); return; }
  for (const f of files) {
    if (!/pdf$/i.test(f.type) && !/\.pdf$/i.test(f.name)) { toast(f.name + ' is geen PDF.'); continue; }
    if (store.kind === 'claude' && f.size > 20 * 1024 * 1024) {
      toast(`${f.name} is ${(f.size / 1048576).toFixed(1)} MB; claude.ai bewaart tot 20 MB per bestand. Verklein de PDF (bijv. scannen op 300 dpi zwart-wit) en probeer opnieuw.`, { sticky: true });
      continue;
    }
    const busy = toast(f.name + ' toevoegen…', { sticky: true });
    try {
      const buf = await f.arrayBuffer();
      let pages = 0, thumb = null;
      try { const d = await loadPdf(buf.slice(0)); pages = d.numPages; thumb = await renderThumb(d).catch(() => null); d.destroy(); }
      catch (e) { busy.remove(); toast(f.name + ' kan niet als PDF worden gelezen.'); continue; }
      const ref = await store.putFile(new File([buf], f.name, { type: 'application/pdf' }));
      const id = uid();
      const title = f.name.replace(/\.pdf$/i, '').replace(/[_]+/g, ' ').replace(/\s+-\s+/g, ' – ').trim();
      store.save('pieces', id, { title, composer: '', genre: 'klassiek', status: 'nieuw', key: '', target: null, beats: 4, file: ref, pages, thumb, sections: [], createdAt: nowISO() });
      busy.remove();
      toast(`${title} staat op de plank (${pages} p.).`, { action: { label: 'Secties invullen', run: () => editPiece(id) } });
    } catch (e) {
      busy.remove(); console.warn(e);
      const code = e && e.code;
      toast(code === 'too_large' ? f.name + ' is te groot (max. 20 MB).' : code === 'quota_or_state' ? 'De opslag van dit artefact is vol. Verwijder eerst een stuk.' : 'Toevoegen mislukt: ' + (e.message || code || 'onbekende fout'), { sticky: true });
    }
  }
}

/* ---------- invoer in de lezer ---------- */
function wireReader() {
  const stage = $('#stage');
  let start = null;
  stage.addEventListener('pointerdown', e => {
    if (R.annot && e.target.classList.contains('ink')) return;
    start = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
    markActivity();
  });
  stage.addEventListener('pointerup', e => {
    if (!start || start.id !== e.pointerId) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y, dt = performance.now() - start.t; start = null;
    if (R.pop) { closePops(); refreshReaderChrome(); return; }
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 700) { dx < 0 ? turnNext() : turnPrev(); return; }
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12) {
      if (R.annot) return;
      const fx = e.clientX / window.innerWidth;
      if (fx < 0.3) turnPrev(); else if (fx > 0.7) turnNext(); else if (RUN.active && playFull()) runPeek(); else toggleBars();
    }
  });
  stage.addEventListener('pointercancel', () => { start = null; });
  $('#reader').addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && e.clientY < 70) showBars(true); });
  $('#reader').append(h('div', { id: 'blockCard', class: 'blockcard', hidden: true }), h('div', { id: 'blockHint', class: 'blockhint', hidden: true, 'aria-live': 'polite' }));
  $('#rBack').append(icon('back'), h('span', { class: 'lab' }, 'Bibliotheek'));
  $('#rBack').addEventListener('click', () => (RUN.active ? finishRun(false) : closeReader()));
  $('#rSections').append(icon('list'), h('span', { class: 'lab' }, 'Secties'));
  $('#rSections').addEventListener('click', () => togglePop('sections'));
  $('#rMetro').append(icon('metro'), h('span', { class: 'lab' }, 'Metronoom'));
  $('#rMetro').addEventListener('click', () => togglePop('metro'));
  $('#rInk').append(icon('pen'), h('span', { class: 'lab' }, 'Pen'));
  $('#rInk').addEventListener('click', () => setAnnot(!R.annot));
  $('#rView').append(icon('view'), h('span', { class: 'lab' }, 'Weergave'));
  $('#rView').addEventListener('click', () => togglePop('view'));
  $('#rReport').append(icon('flag'), h('span', { class: 'lab' }, 'Melden'));
  $('#rReport').addEventListener('click', () => { closePops(); reportDialog(); });
  $('#rTimer').addEventListener('click', () => { const s = R.session; if (!s) return; if (s.waiting) { startClock(); return; } s.paused = !s.paused; s.autoPaused = false; s.lastAct = performance.now(); updateTimer(); });

  document.addEventListener('keydown', e => {
    if (!R.open || $('#dlg').open) return;
    if (e.target.matches && e.target.matches('input, textarea, select')) return;
    const k = e.key; markActivity();
    if (k === 'Enter' && RUN.active && RUN.waitStart) { e.preventDefault(); beginBlock(); }
    else if (k === 'Enter' && RUN.active && RUN.done) { e.preventDefault(); runNext(false); }
    else if (['ArrowRight', 'PageDown', 'ArrowDown', ' '].includes(k)) { e.preventDefault(); turnNext(); }
    else if (['ArrowLeft', 'PageUp', 'ArrowUp'].includes(k)) { e.preventDefault(); turnPrev(); }
    else if (k === 'Home') gotoPage(0);
    else if (k === 'End') gotoPage(R.pageCount - 1);
    else if (k === 'Escape') { if (R.annot) setAnnot(false); else if (R.pop) { closePops(); refreshReaderChrome(); } else if (RUN.active) finishRun(false); else closeReader(); }
    else if (k === 'm' || k === 'M') { metro.on ? metro.stop() : metro.start(); }
    else if (k === 'p' || k === 'P') $('#rTimer').click();
  });
  let rt = null;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
    if (R.open) { R.canvases.clear(); if (twoUp() && R.half) R.half = false; renderSpread(); }
    else if (ui.view === 'log') renderView();
  }, 150); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && R.open) requestWakeLock(); else persistSession(); });
  window.addEventListener('pagehide', () => persistSession());
}

function buildSummary() {
  const lines = [], nexts = [], seen = new Set(), groups = new Map();
  for (const r of RUN.results) {
    const key = statKey(r);
    const g = groups.get(key) || { r, sec: 0, attempts: [], skipped: true, notReached: true };
    g.sec += r.actualSec; g.attempts.push(...r.attempts); g.skipped = g.skipped && (r.skippedRun || r.notReached); g.notReached = g.notReached && r.notReached;
    groups.set(key, g);
  }
  for (const [key, g] of groups) {
    const L = blockLabel(g.r);
    const clean = g.attempts.filter(a => a.clean).length;
    const bpms = g.attempts.filter(a => a.clean && a.bpm).map(a => a.bpm);
    const st = RUN.stats[key];
    const parts = [fmtDur(g.sec)];
    if (g.attempts.length) parts.push(g.attempts.length + (g.attempts.length === 1 ? ' poging' : ' pogingen'), clean + '× schoon');
    if (bpms.length) parts.push('≈' + median(bpms) + ' BPM');
    if (st && st.bumpedTo) parts.push('werktempo → ' + st.bumpedTo);
    lines.push({ kind: g.r.kind, skipped: g.skipped, text: L.title + (L.section ? ' — ' + L.section : '') + ': ' + (g.notReached ? 'niet aan toegekomen' : g.skipped ? 'overgeslagen' : parts.join(', ')) });
    if ((g.r.kind === 'focus' || g.r.kind === 'active' || g.r.kind === 'tech') && L.piece && !seen.has(L.piece.id) && !g.skipped) {
      seen.add(L.piece.id);
      const label = L.section || L.title;
      const tempo = L.sec ? sectionTempo(L.piece.id, L.sec.id) : null;
      const prop = proposeNext({ label, attempts: g.attempts.length, clean, bumpedTo: st && st.bumpedTo, tempo });
      nexts.push({ pieceId: L.piece.id, sectionId: g.r.sectionId || null, nextSection: g.r.sectionId || null, label, tempo, step: (L.sec && L.sec.step) || 4, title: L.title, kind: prop.kind, text: prop.text, bump: false });
    }
  }
  return { lines, nexts, feedback: { chips: [], text: '' } };
}

    .filter(x => { const k = x.file.kind + ':' + x.file.id; if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => a.title.localeCompare(b.title, 'nl'));

    thumbs.delete(id);

/* ---------- Sync met Claude via je privé GitHub-repo (ROADMAP §4e) ----------
   Lessenaar schrijft stand.md, sessies/*.json en repertoire.txt; Claude schrijft plan.md en repertoire.txt.
   Het token staat alleen op dit apparaat en gaat alleen naar api.github.com. */
const SYNC = { busy: false, err: null, last: LS.get('syncLast', null), plan: null, planMd: '', rep: null, resolved: [] };
function syncCfg() { const c = LS.get('sync', null); return c && validRepo(c.repo) && c.token ? c : null; }
function ghMessage(status) {
  return status === 401 ? 'het token is ongeldig of verlopen'
    : status === 403 ? 'het token mag dit niet (Contents: lezen en schrijven?)'
    : status === 404 ? 'repo niet gevonden (de naam, of het token kan er niet bij)'
    : status === 409 || status === 422 ? 'een bestand veranderde net; probeer het opnieuw'
    : 'GitHub gaf fout ' + status;
}
async function gh(path, opts = {}) {
  const c = syncCfg(); if (!c) throw new Error('sync staat uit');
  let res;
  try {
    res = await fetch('https://api.github.com/repos/' + c.repo + path, { method: opts.method || 'GET', cache: 'no-store',
      headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + c.token, 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined });
  } catch (e) { throw new Error('geen verbinding met GitHub'); }
  if (res.status === 404 && opts.allow404) return null;
  if (res.status === 409 && opts.allowEmpty) return null;   // lege repo: nog geen commits
  if (!res.ok) { const err = new Error(ghMessage(res.status)); err.status = res.status; throw err; }
  return res.json();
}
const ghPath = path => path.split('/').map(encodeURIComponent).join('/');
async function ghText(path, ref) {
  const f = await gh('/contents/' + ghPath(path) + (ref ? '?ref=' + encodeURIComponent(ref) : ''), { allow404: true });
  return f && !Array.isArray(f) && f.content != null ? fromB64Utf8(f.content) : null;
}
async function ghPut(path, text, message, b64) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const cur = await gh('/contents/' + ghPath(path), { allow404: true });
    if (!b64 && cur && cur.content != null && fromB64Utf8(cur.content) === text) return false;   // staat er al zo
    try { await gh('/contents/' + ghPath(path), { method: 'PUT', body: { message, content: b64 || b64Utf8(text), ...(cur && cur.sha ? { sha: cur.sha } : {}) } }); return true; }
    catch (e) { if (attempt || (e.status !== 409 && e.status !== 422)) throw e; }

}
// De nieuwste versie van een bestand op de hoofdbranch of een claude/-branch.
async function ghLatest(file, refs, def) {
  const cands = await Promise.all(refs.map(async ref => {
    const c = await gh(`/commits?sha=${encodeURIComponent(ref)}&path=${encodeURIComponent(file)}&per_page=1`, { allow404: true, allowEmpty: true });
    return c && c[0] ? { ref, sha: c[0].sha, date: c[0].commit.committer.date, isDefault: ref === def } : null;
  }));
  const best = newestSource(cands);
  return best ? { ...best, text: await ghText(file, best.sha) } : null;
}
function offerPlanFrom(md) {
  SYNC.planMd = md || ''; SYNC.plan = null;
  const ses = pickPlanSession(planSessionsFromMd(SYNC.planMd), LS.get('syncUsed', []));
  const pcs = allPieces().filter(p => !p.example);
  const usable = t => [parsePlanText(t, pcs, { list: true }), parsePlanText(t, pcs)].some(r => r.blocks.some(b => !b.unknown));
  if (ses && usable(ses.text)) SYNC.plan = ses;
}
function markPlanUsed(text) {

}
function markRepSeen(hash) { LS.set('syncRep', hash); SYNC.rep = null; queueRender(); }
async function syncPull() {
  const info = await gh('');
  const def = info.default_branch || 'main';
  const branches = ((await gh('/branches?per_page=100', { allowEmpty: true })) || []).map(b => b.name).filter(n => n === def || n.startsWith('claude/'));
  if (!branches.includes(def)) branches.unshift(def);
  const [plan, rep] = await Promise.all([ghLatest('plan.md', branches, def), ghLatest('repertoire.txt', branches, def)]);
  offerPlanFrom(plan && plan.text);
  SYNC.resolved = parseResolved(await ghText('feedback/opgelost.json'));
  SYNC.rep = null;
  const repHash = rep && rep.text != null ? textHash(rep.text) : null;
  if (repHash && repHash !== LS.get('syncRep', '')) {
    const n = repertoireChanges(rep.text, allPieces(), meta().lessons || null);
    if (n) SYNC.rep = { text: rep.text, hash: repHash, n }; else LS.set('syncRep', repHash);

}
async function syncNow(opts = {}) {
  if (!syncCfg() || SYNC.busy || !store) return false;

  try {
    const { repHash } = await syncPull();
    // meldingen (ook vanaf een leeg apparaat) en de foutlog
    let sent = 0;
    for (let q = LS.get('fbQueue', []) || []; q.length; q = LS.get('fbQueue', []) || []) {
      const it = q[0];
      if (it.foto && it.doc.photoPath) await ghPut(it.doc.photoPath, null, 'Lessenaar: schermafbeelding bij melding', it.foto);
      await ghPut(it.doc.path, it.doc.markdown, 'Lessenaar: melding (' + (it.soort || 'idee') + ')');
      LS.set('fbQueue', q.slice(1)); sent++;
    }
    const errs = errorsText(LS.get('errLog', []) || [], APP_VERSION);
    if (errs && textHash(errs) !== LS.get('syncErr', '')) { await ghPut('feedback/fouten.md', errs, 'Lessenaar: foutmeldingen'); LS.set('syncErr', textHash(errs)); }
    if (sent) toast(sent === 1 ? 'Melding verstuurd naar je data-repo.' : sent + ' meldingen verstuurd naar je data-repo.');
    // een lege bibliotheek (bijvoorbeeld een nieuw apparaat) schrijft niets over je echte stand heen
    if (store.canUpload && allPieces().some(p => !p.example)) {
      const pieces = allPieces();
      const done = new Set(LS.get('syncRuns', []));
      const todo = store.all('runs').filter(r => r.endedAt && !done.has(r.id)).sort((a, b) => String(a.startedAt).localeCompare(String(b.startedAt)));
      for (const r of todo) {
        await ghPut(sessionPath(r), JSON.stringify(sessionRecord(r, pieces), null, 2) + '\n', 'Lessenaar: sessie ' + sessionPath(r).slice(8, -5));
        done.add(r.id); LS.set('syncRuns', [...done]);
      }
      const stand = currentStand() + '\n';
      if (textHash(stand) !== LS.get('syncStand', '')) { await ghPut('stand.md', stand, 'Lessenaar: stand'); LS.set('syncStand', textHash(stand)); }
      // repertoire.txt volgt de app, behalve als er een wijziging van Claude klaarstaat
      if (!SYNC.rep && (!repHash || repHash === LS.get('syncRep', ''))) {
        const rep = libraryText(pieces, meta().lessons || null) + '\n';
        if (textHash(rep) !== repHash) await ghPut('repertoire.txt', rep, 'Lessenaar: repertoire');
        LS.set('syncRep', textHash(rep));
      }
    }
    SYNC.last = Date.now(); LS.set('syncLast', SYNC.last);
    if (opts.loud) toast('Gesynchroniseerd met je data-repo.' + (SYNC.plan ? ' Er staat een nieuw plan van Claude klaar.' : ''));
    return true;
  } catch (e) {
    SYNC.err = e.message;
    if (opts.loud) toast('Sync mislukt: ' + e.message, { sticky: true });
    return false;

}
function syncStatusText() {
  if (!syncCfg()) return 'Uit. Vul je privé-repo en token in.';
  if (SYNC.busy) return 'Bezig met synchroniseren…';
  if (SYNC.err) return 'Sync mislukt: ' + SYNC.err + '.';
  if (!SYNC.last) return 'Nog niet gesynchroniseerd.';
  const d = new Date(SYNC.last);
  return 'Gesynchroniseerd ' + (dayKey(d) === dayKey(Date.now()) ? 'om ' : d.getDate() + ' ' + MONTHS[d.getMonth()] + ' om ') + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + '.';
}
function renderSyncState() {

}
function syncBanners() {

    h('div', { class: 'sb-text' }, h('b', {}, title), h('small', {}, sub)),

    Q ? banner('Claude paste je repertoire aan', Q.n + (Q.n === 1 ? ' stuk verandert' : ' stukken veranderen'), () => importTextDialog(Q.text, () => markRepSeen(Q.hash)), () => markRepSeen(Q.hash)) : null);

function syncSettingsGroup() {

  const repo = h('input', { id: 'set-repo', class: 'set-inp', placeholder: 'eigenaar/lessenaar-data', value: c.repo || '', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false' });

    if (!info.private) { LS.set('sync', null); status.textContent = 'Deze repo is openbaar. Lessenaar zet je oefendata alleen in een privé-repo.'; return; }
    if (LS.get('syncRepoSeen', '') !== r) { LS.set('syncRuns', []); LS.set('syncStand', ''); LS.set('syncRep', ''); LS.set('syncUsed', []); LS.set('syncRepoSeen', r); }

    h('label', { class: 'set-line', for: 'set-repo' }, h('span', {}, 'Repo'), repo),

    h('div', { class: 'row' },
      h('button', { type: 'button', class: 'btn primary', onclick: connect }, on ? 'Opslaan en synchroniseren' : 'Verbinden'),
      on ? h('button', { type: 'button', class: 'btn', onclick: () => syncNow({ loud: true }) }, 'Nu synchroniseren') : null,
      on ? h('button', { type: 'button', class: 'btn', onclick: () => { LS.set('sync', null); SYNC.plan = SYNC.rep = null; SYNC.err = null; drawSettings(); queueRender(); toast('Sync uit. Het token is van dit apparaat verwijderd.'); } }, 'Ontkoppelen') : null),
    status);
}

/* ---------- Melden: feedback met context naar de privé data-repo ----------
   Eén markdown-bestand per melding in feedback/, eventueel met een schermafbeelding.
   Zonder sync blijft de melding op het apparaat staan tot de sync aan staat. */
function deviceText() {
  const ua = navigator.userAgent || '';
  const kind = /iPhone/.test(ua) ? 'iPhone' : (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) ? 'iPad' : /Android/.test(ua) ? 'Android' : 'computer';
  return `${kind} · ${innerWidth}×${innerHeight}` + (navigator.requestMIDIAccess ? '' : ' · geen Web MIDI');
}
function reportContext() {
  const b = RUN.active ? curBlock() : null, L = b ? blockLabel(b) : null;
  return {
    scherm: R.open ? 'lezer' + (RUN.active ? ' (sessie)' : '') : ({ today: 'Vandaag', library: 'Bibliotheek', lists: 'Oefenlijsten', log: 'Logboek' })[ui.view] || ui.view || '',
    stuk: R.open && R.piece ? R.piece.title : '',

    fouten: (LS.get('errLog', []) || []).slice(-5),
  };
}
async function shrinkImage(file, max, quality) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', quality).split(',')[1];
  } finally { URL.revokeObjectURL(url); }
}
function queueReport(item) {
  // localStorage kan vol raken met een grote foto: dan zonder foto bewaren
  const q = LS.get('fbQueue', []) || [];
  try { localStorage.setItem('lessenaar.fbQueue', JSON.stringify([...q, item])); return true; }
  catch { try { localStorage.setItem('lessenaar.fbQueue', JSON.stringify([...q, { ...item, foto: null }])); return 'zonder foto'; } catch { return false; } }
}
async function copyText(t) { try { await navigator.clipboard.writeText(t); toast('Gekopieerd.'); } catch { toast('Kopiëren lukte niet.'); } }

// "Nieuw in deze versie": wat er veranderd is, en welke van jouw meldingen zijn opgelost (uit feedback/opgelost.json).

async function boot() {
  $('#settingsBtn').append(icon('sliders'));
  $('#reportBtn').append(icon('flag'));
  $('#reportBtn').addEventListener('click', () => reportDialog());
  $('#settingsBtn').addEventListener('click', openSettings);
  $('#midiChip').addEventListener('click', () => { if (midi.status === 'on') openSettings(); else if (midi.status === 'blocked' && IN_ARTIFACT) midiHelp(); else midiConnect(true); });
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  $('#fileIn').addEventListener('change', e => { const f = [...e.target.files]; e.target.value = ''; addFiles(f); });
  $('#backupIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); });
  let dragN = 0, dropEl = null;
  const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  window.addEventListener('dragenter', e => { if (!hasFiles(e) || R.open) return; dragN++; if (!dropEl) { dropEl = h('div', { class: 'drop' }, h('div', {}, 'Laat los om toe te voegen')); document.body.append(dropEl); } });
  window.addEventListener('dragleave', () => { if (--dragN <= 0 && dropEl) { dropEl.remove(); dropEl = null; dragN = 0; } });
  window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); dragN = 0; if (dropEl) { dropEl.remove(); dropEl = null; } if (!R.open) addFiles([...e.dataTransfer.files]); });
  wireReader(); updateMidiChip();

  $('#main').replaceChildren(h('p', { class: 'note' }, 'Bibliotheek openen…'));
  store = await pickStore();
  store.on(() => queueRender());
  const v = location.hash.slice(1);
  setView(['today', 'library', 'lists', 'log'].includes(v) ? v : 'today');
  if (LS.get('midiAuto', false) && !IN_ARTIFACT) setTimeout(() => midiConnect(false), 300);
  else if (!IN_ARTIFACT) setTimeout(() => { if (!navigator.requestMIDIAccess && midi.status === 'off') { midi.status = 'unsupported'; updateMidiChip(); } }, 1500);
  ensurePdfJs().catch(e => toast('pdf.js kon niet laden (' + e.message + '). Controleer je internetverbinding.', { sticky: true }));
  if (syncCfg()) setTimeout(() => syncNow(), 800);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && syncCfg() && Date.now() - (SYNC.last || 0) > 60e3) syncNow(); });
  window.addEventListener('online', () => { if (syncCfg()) syncNow(); });
}
boot();
