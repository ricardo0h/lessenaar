<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..600&display=swap">
<style>
/* Layout: een lessenaar. Ebbenhouten frame, papier in het midden. Bibliotheek = plank met partituren; lezer = volledig podium. */
:root {
  --bg: #ECEDEA;
  --surface: #F8F8F6;
  --surface-2: #E2E4E0;
  --ink: #16181A;
  --muted: #586066;
  --line: #CFD3CE;
  --accent: #85631A;
  --accent-weak: #EBE1C8;
  --on-accent: #FFFFFF;
  --bar: #9A7420;
  --paper: #FFFFFF;
  --stage: #1C1E20;
  --stage-2: #2B2E31;
  --stage-ink: #ECEAE5;
  --stage-muted: #A5A9AD;
  --brass: #C9A24A;
  --ok: #2E7A4D;
  --warn: #9A5D12;
  --info: #2D5B96;
  --danger: #A3322A;
  --shadow: 0 1px 2px rgba(20, 22, 24, .07), 0 8px 22px rgba(20, 22, 24, .09);
  --font-display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
  --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121314; --surface: #1A1C1E; --surface-2: #25282B; --ink: #ECEAE5; --muted: #9CA1A5;
    --line: #2F3337; --accent: #C9A24A; --accent-weak: #3A3220; --on-accent: #17140B; --bar: #B08A35;
    --paper: #FFFFFF; --stage: #0D0E0F; --stage-2: #222528; --stage-ink: #ECEAE5; --stage-muted: #A5A9AD;
    --brass: #C9A24A; --ok: #63B585; --warn: #DDA04B; --info: #86AEE3; --danger: #E27A70;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 26px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121314; --surface: #1A1C1E; --surface-2: #25282B; --ink: #ECEAE5; --muted: #9CA1A5;
  --line: #2F3337; --accent: #C9A24A; --accent-weak: #3A3220; --on-accent: #17140B; --bar: #B08A35;
  --paper: #FFFFFF; --stage: #0D0E0F; --stage-2: #222528; --stage-ink: #ECEAE5; --stage-muted: #A5A9AD;
  --brass: #C9A24A; --ok: #63B585; --warn: #DDA04B; --info: #86AEE3; --danger: #E27A70;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 26px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* ---------- top ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding: 12px clamp(16px, 4vw, 40px); max-width: 1320px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.wordmark { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 28px; letter-spacing: -.01em; line-height: 1; }
.brand-sub { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 999px; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 500; font-size: 14px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.top-actions { display: flex; gap: 8px; align-items: center; }
/* tikdoelen in de bovenbalk minstens 44 px (#78) */
.top .tabs button, .top-actions .chip { min-height: 44px; }
.top-actions .icon-btn { width: 44px; height: 44px; }

.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.dot.err { background: var(--warn); }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; border: 1px solid transparent; background: transparent; }
.icon-btn:hover { background: var(--surface-2); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; font-weight: 500; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.brass { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
svg.i { width: 18px; height: 18px; flex: none; }

/* Navigatie ontwerp v2 (#142): Vandaag · Bibliotheek · Logboek. iPad bovenin; iPhone een zwevende tabbalk onderin. */
.lib-switch { margin-bottom: 14px; }
@media (max-width: 640px) {
  /* backdrop-filter maakt van de balk het kader voor position: fixed; zonder kan de tabbalk naar onderen */
  .top { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--bg); }
  .top-in { flex-wrap: nowrap; padding-block: 8px; gap: 8px; }
  .wordmark { font-size: 24px; }
  .top-actions { gap: 2px; min-width: 0; }
  .top-actions .chip { min-width: 0; overflow: hidden; }
  .top-actions .chip span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .top .tabs { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    width: min(360px, calc(100vw - 32px)); justify-content: space-between; padding: 4px; border-radius: 999px;
    background: color-mix(in srgb, var(--v-surface) 90%, transparent); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border: 1px solid var(--v-separator); box-shadow: 0 8px 30px rgba(0, 0, 0, .3); }
  .top .tabs button { flex: 1; min-height: 48px; font-size: 15px; padding: 6px 8px; color: var(--v-text-secondary); }
  .top .tabs button[aria-selected="true"] { background: var(--v-fill-selected); color: var(--v-text-primary); box-shadow: none; }
  #main.wrap { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); }
  .toasts { bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); }
  #reader:not([hidden]) ~ .toasts { bottom: auto; }
}
@media (max-width: 900px) { .brand-sub { display: none; } }
/* ---------- main ---------- */
.wrap { padding-inline: clamp(16px, 4vw, 40px); padding-block: 24px 64px; max-width: 1320px; margin: 0 auto; }
.view-head { display: flex; flex-wrap: wrap; align-items: end; gap: 16px; justify-content: space-between; margin-bottom: 18px; }
.view-head h1 { font-family: var(--font-display); font-weight: 500; font-size: clamp(30px, 4vw, 42px); letter-spacing: -.015em; line-height: 1.05; }
.sub { color: var(--muted); margin: 6px 0 0; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0 10px; min-width: 0; }
.search input { border: 0; background: transparent; padding: 8px 0; width: 180px; max-width: 46vw; outline: none; }
select.sel { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.filters button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 28px 22px; }
.card { position: relative; display: flex; flex-direction: column; gap: 10px; cursor: pointer; border-radius: 6px; outline-offset: 6px; min-width: 0; }
.cover { aspect-ratio: 1 / 1.414; max-width: 100%; background: var(--paper); border-radius: 3px; box-shadow: var(--shadow); overflow: hidden; position: relative; transition: transform .18s ease, box-shadow .18s ease; }
.card:hover .cover { transform: translateY(-3px); }
.cover img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.cover .ph { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 16px; color: #2a2a2a; font-family: var(--font-display); font-size: 18px; line-height: 1.15; }
.cover .ph small { display: block; font-family: var(--font-ui); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #777; margin-top: 8px; }
.ribbon { position: absolute; bottom: 12px; left: 0; background: var(--accent); color: var(--on-accent); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px 3px 10px; font-weight: 600; }
.card-title { font-family: var(--font-display); font-weight: 500; font-size: 19px; line-height: 1.15; overflow-wrap: anywhere; }
.card-comp { color: var(--muted); font-size: 13px; margin: 2px 0 0; overflow-wrap: anywhere; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.card-more { position: absolute; top: 6px; right: 6px; background: color-mix(in srgb, var(--paper) 88%, transparent); color: #222; width: 30px; height: 30px; border-radius: 8px; opacity: 0; transition: opacity .15s; }
.card:hover .card-more, .card:focus-within .card-more, .card-more:focus-visible { opacity: 1; }
@media (hover: none) { .card-more { opacity: 1; } }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--ink); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.nieuw { color: var(--muted); }
.pill.instuderen { color: var(--info); }
.pill.bijschaven { color: var(--warn); }
.pill.repertoire { color: var(--ok); }
.pill.actief { color: var(--info); }
.pill.onderhoud { color: var(--ok); }
.pill.geparkeerd { color: var(--muted); }
.badge-focus { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--accent); }

.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 36px 24px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty h2 { font-family: var(--font-display); font-weight: 500; font-size: 24px; color: var(--ink); }
.empty p { max-width: 52ch; margin: 0; }

.drop { position: fixed; inset: 0; z-index: 80; background: color-mix(in srgb, var(--bg) 80%, transparent); display: grid; place-items: center; pointer-events: none; }
.drop div { border: 2px dashed var(--accent); border-radius: 18px; padding: 40px 56px; font-family: var(--font-display); font-size: 26px; background: var(--surface); }

/* lists */
.lists { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.list-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.list-card h3 { font-family: var(--font-display); font-weight: 500; font-size: 22px; }
.list-card ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.list-card li { overflow-wrap: anywhere; }
.list-card li span { color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* log */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.tile .k { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tile .v { font-family: var(--font-mono); font-size: 28px; font-weight: 500; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .h { font-size: 13px; color: var(--muted); margin-top: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 18px; min-width: 0; }
.panel h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.panel h2 span { color: var(--muted); font-weight: 400; }
.chart { position: relative; }
.chart svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); }
.bars-list { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 2fr) auto; gap: 10px 12px; align-items: center; }
.bl-row { display: contents; }
.bl-row .num { text-align: right; }
.bl-row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bl-track { height: 10px; background: var(--surface-2); border-radius: 0 4px 4px 0; overflow: hidden; }
.bl-fill { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
td.num, th.num { text-align: right; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 820px) { .two { grid-template-columns: minmax(0, 1fr); } }

/* dialog */
dialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--surface); color: var(--ink); width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 24px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10, 11, 12, .45); }
/* Blad uit ontwerp v2, stijl Vleugel (#79). De tokens gelden alleen binnen .v2s, tot de nieuwe stijl er voor de hele app is (#140). */
.v2s { --surface: #ffffff; --fill: #f1efea; --fill-selected: #e2dfd8; --separator: #d9d6ce; --control-border: #7a7d83;
  --text-primary: #17181a; --text-secondary: #5a5d62; --accent: #8a5200; --on-accent: #ffffff; --negative: #b5432a;
  --font: -apple-system, system-ui, "Helvetica Neue", sans-serif; --radius-control: 12px; --radius-sheet: 22px; --target-min: 44px; --control: 52px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .v2s { --surface: #1c1e21; --fill: #2b2e33; --fill-selected: #3a3e44; --separator: #33363b; --control-border: #7b8088;
  --text-primary: #f3f1ec; --text-secondary: #b7b9bd; --accent: #f0b35a; --on-accent: #1c1304; --negative: #f29a80; } }
:root[data-theme="dark"] .v2s { --surface: #1c1e21; --fill: #2b2e33; --fill-selected: #3a3e44; --separator: #33363b; --control-border: #7b8088;
  --text-primary: #f3f1ec; --text-secondary: #b7b9bd; --accent: #f0b35a; --on-accent: #1c1304; --negative: #f29a80; }
dialog.v2s { border: 0; border-radius: var(--radius-sheet); background: var(--surface); color: var(--text-primary); font-family: var(--font); font-size: 17px; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
.v2s form { display: flex; flex-direction: column; max-height: calc(100vh - 32px); }
.v2s-body { padding: 22px 22px 8px; overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.v2s h2 { font-family: var(--font); font-size: 22px; font-weight: 600; margin: 0 0 6px; }
.v2s p { margin: 0; font-size: 15px; color: var(--text-secondary); }
.v2s-group { display: grid; gap: 8px; min-width: 0; }
.v2s-label { font-size: 15px; font-weight: 600; color: var(--text-secondary); }
.v2s-opts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.v2s-opts.scroll { max-height: 212px; overflow: auto; }
.v2s-opts button { min-height: var(--target-min); padding: 8px 14px; border-radius: var(--radius-control); border: 1px solid var(--separator); background: var(--fill); color: var(--text-primary); font: inherit; text-align: left; overflow-wrap: anywhere; }
.v2s-opts button[aria-pressed="true"] { background: var(--fill-selected); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 600; }
.v2s-opts button[aria-pressed="true"]::before { content: "✓ "; color: var(--accent); }
.v2s-min { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 15px; }
.v2s input[type=number], .v2s input[type=text] { min-height: var(--target-min); border: 1px solid var(--control-border); border-radius: var(--radius-control); background: var(--surface); color: var(--text-primary); font: inherit; padding: 8px 12px; min-width: 0; }
.v2s input[type=number] { width: 84px; font-variant-numeric: tabular-nums; }
.v2s input[type=text] { width: 100%; }
.v2s-err { color: var(--negative); font-weight: 600; min-height: 1.3em; }
.v2s-err:not(:empty)::before { content: "× "; }
.v2s-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 12px 22px calc(env(safe-area-inset-bottom, 0px) + 18px); border-top: 1px solid var(--separator); }
.v2s-foot button { min-height: var(--control); padding: 0 22px; border-radius: var(--radius-control); border: 1px solid var(--control-border); background: transparent; color: var(--text-primary); font: inherit; font-weight: 600; }
.v2s-foot button.go { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
@media (max-width: 640px) { dialog.v2s { width: 100vw; max-width: 100vw; margin: auto 0 0; border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; } }
.dlg { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 10px; }
.dlg-head h2 { font-family: var(--font-display); font-weight: 500; font-size: 24px; }
.dlg-body { padding: 4px 18px 16px; overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.dlg-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.dlg-foot .left { margin-right: auto; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .fields { grid-template-columns: minmax(0, 1fr); } }
.field { display: grid; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.ex-task { display: grid; gap: 6px; grid-column: 1 / -1; }
.ex-task[hidden] { display: none; }
.ex-task .set-line { justify-content: flex-start; min-height: 44px; }
.ex-task input[type=checkbox] { width: 22px; height: 22px; }
.field label, .lbl { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.field input, .field select, .sec-row input, .it-row select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.sec-table { display: grid; gap: 6px; }
.sec-row { display: grid; grid-template-columns: minmax(0, 2.2fr) 60px minmax(0, 1fr) 64px 64px 56px 44px 36px; gap: 6px; align-items: center; }

/* ---------- Ontwerp v2 (#140): tokens van Vleugel ----------
   Naast de oude variabelen, met voorvoegsel --v- omdat --surface, --accent en --paper al bestaan; de oude verdwijnen
   per scherm (docs/design/v2-voorstel.md). De lezer gebruikt ze als eerste. */
:root {
  --v-ground: #eceae4; --v-surface: #ffffff; --v-fill: #f1efea; --v-fill-selected: #e2dfd8;
  --v-separator: #d9d6ce; --v-control-border: #7a7d83;
  --v-text-primary: #17181a; --v-text-secondary: #5a5d62;
  --v-paper: #ffffff; --v-paper-ink: #1b1b1b;
  --v-accent: #8a5200; --v-on-accent: #ffffff; --v-positive: #1f7a5c; --v-negative: #b5432a;
  --v-font: -apple-system, system-ui, "Helvetica Neue", sans-serif;
  --radius-control: 12px; --radius-card: 16px; --radius-sheet: 22px;
  --target-min: 44px; --control: 52px; --check: 64px; --start: 104px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --v-ground: #0f1012; --v-surface: #1c1e21; --v-fill: #2b2e33; --v-fill-selected: #3a3e44;
    --v-separator: #33363b; --v-control-border: #7b8088;
    --v-text-primary: #f3f1ec; --v-text-secondary: #b7b9bd;
    --v-paper: #efeadf; --v-paper-ink: #1b1b1b;
    --v-accent: #f0b35a; --v-on-accent: #1c1304; --v-positive: #84d4b2; --v-negative: #f29a80;
  }
}
:root[data-theme="dark"] {
  --v-ground: #0f1012; --v-surface: #1c1e21; --v-fill: #2b2e33; --v-fill-selected: #3a3e44;
  --v-separator: #33363b; --v-control-border: #7b8088;
  --v-text-primary: #f3f1ec; --v-text-secondary: #b7b9bd;
  --v-paper: #efeadf; --v-paper-ink: #1b1b1b;
  --v-accent: #f0b35a; --v-on-accent: #1c1304; --v-positive: #84d4b2; --v-negative: #f29a80;
}
/* De lezer in Vleugel: de oude lezer-variabelen wijzen binnen de lezer naar de nieuwe tokens. */
.reader { --stage: var(--v-ground); --stage-2: var(--v-fill); --stage-ink: var(--v-text-primary); --stage-muted: var(--v-text-secondary);
  --brass: var(--v-accent); --ok: var(--v-positive); --danger: var(--v-negative);
  font-family: var(--v-font); font-size: 17px; }
.reader .rtitle b, .reader .rb-info b, .reader .term, .reader .stage-msg h2 { font-family: var(--v-font); font-weight: 600; font-style: normal; }
.reader .rpage, .reader .timer, .reader .rb-clock, .reader .bpm, .reader .rb-info span, .reader .folio, .reader .sec-item small, .reader .sec-item .tm { font-family: var(--v-font); font-variant-numeric: tabular-nums; }
/* het blad blijft zoals de PDF is: zwarte noten, in donker op warm gedimd wit */
.sheet { background: var(--v-paper); }
.sheet::after { content: ""; position: absolute; inset: 0; background: var(--v-paper); mix-blend-mode: multiply; pointer-events: none; }
/* glas: alleen voor wat tijdelijk over het blad komt */
.glass, .reader .rbar, .reader .pop, .reader .inkbar, .reader .queuebar, .reader .folio {
  background: color-mix(in srgb, var(--v-surface) 90%, transparent); color: var(--v-text-primary);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-color: var(--v-separator); }
.glass { border: 1px solid var(--v-separator); border-radius: var(--radius-sheet); box-shadow: 0 12px 40px rgba(0, 0, 0, .35); }
.reader .rbar { border-bottom: 1px solid var(--v-separator); }
.reader .rbtn { min-height: var(--target-min); height: auto; font-size: 15px; border-radius: var(--radius-control); }
.reader .pop { border-radius: var(--radius-card); z-index: 9; }   /* boven wat onderaan zweeft */
.reader .pop input, .reader .pop select, .reader .rangebox input { background: var(--v-fill); border-color: var(--v-control-border); color: var(--v-text-primary); }
.reader .pop .btn, .reader .runbar .btn { background: var(--v-fill); color: var(--v-text-primary); border-color: var(--v-separator); min-height: var(--target-min); border-radius: var(--radius-control); }
.reader .pop .btn.brass, .reader .runbar .btn.brass { background: var(--v-accent); color: var(--v-on-accent); border-color: var(--v-accent); }
.reader .prog, .reader .beats i { background: var(--v-fill-selected); }
.reader .beats i.on, .reader .prog i { background: var(--v-accent); }
.reader .half-line span { color: var(--v-on-accent); }
.reader.bars-hidden .queuebar { display: none; }   /* de oefenlijst hoort bij "alles op een tik" */
/* onderaan: de stap bij het begin, de akkoorden en het paneel */
.dock { position: absolute; z-index: 8; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); width: min(780px, calc(100vw - 24px));
  max-height: min(calc(100% - 96px), 70vh); display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; pointer-events: none; }
.dock > * { pointer-events: auto; flex: none; }
.dock .runbar { position: static; transform: none; width: auto; min-height: 0; border-radius: var(--radius-sheet); padding: 12px 14px; }
.dock .runbar.panel { flex: 0 1 auto; overflow: auto; padding: 16px 18px; gap: 12px 14px; }
.runbar.done { border-color: var(--v-accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--v-accent) 45%, transparent), 0 12px 40px rgba(0, 0, 0, .35); }
.reader .rb-ok, .reader .rb-bad, .reader .rb-yes, .reader .rb-no { border-color: var(--v-separator); color: var(--v-text-primary); min-height: var(--control); border-radius: var(--radius-control); }
.reader .rb-info small { font-size: 15px; letter-spacing: 0; text-transform: none; }
.reader .rb-msg, .reader .rb-ask { font-size: 17px; }
/* Blok klaar (#47, #141): de "Klaar als …"-zin met ✓ en ✗; de lijn eronder loopt leeg tot de sessie vanzelf doorgaat */
.rb-verdict { position: relative; padding-bottom: 8px; }
.rb-verdict .vk-text { display: grid; gap: 2px; }
.rb-verdict .vk-text small { font-size: 14px; font-weight: 600; color: var(--v-accent); }

.rb-verdict .vk-count { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 2px; background: var(--v-accent); transform-origin: left; animation: vk-count linear forwards; }
@keyframes vk-count { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { .rb-verdict .vk-count { animation: none; opacity: .5; } }
.rb-count { font-variant-numeric: tabular-nums; }
.rb-steps { grid-column: 1 / -1; display: grid; gap: 8px; font-size: 17px; line-height: 1.4; }
.rb-steps .bc-where { margin: 0; font-weight: 600; }
.rb-steps ol { margin: 0; padding-left: 24px; display: grid; gap: 6px; color: var(--v-text-secondary); }
.rb-steps li.now { color: var(--v-text-primary); font-size: 19px; }
.rb-steps li.now > span { margin-right: 10px; }
.rb-steps .sp-done { min-width: var(--control); min-height: var(--target-min); border-radius: var(--radius-control); border: 0; background: var(--v-accent); color: var(--v-on-accent); font: 600 20px var(--v-font); vertical-align: middle; }

.rb-steps .btn { justify-self: start; }
.rb-actions .rb-close { margin-right: auto; min-width: var(--target-min); padding: 0 12px; }
.rb-steps .chord-card { background: var(--v-fill); }
.step-intro { display: grid; gap: 4px; width: 100%; padding: 14px 18px; text-align: left; font: inherit; }
.step-intro > small, .step-intro .si-title, .step-intro .si-meta { font-size: 15px; color: var(--v-text-secondary); }
.step-intro .si-title b { color: var(--v-text-primary); font-weight: 600; }
.step-intro .si-step { display: grid; gap: 2px; margin: 4px 0; }
.step-intro .si-step small { font-size: 15px; color: var(--v-accent); font-weight: 600; }
.step-intro .si-step b { font-size: 22px; font-weight: 600; line-height: 1.25; }
.chord-layer { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 10px 12px 12px 16px; }
.cl-head { display: flex; align-items: center; gap: 12px; min-height: var(--target-min); }
.cl-live { flex: 1; min-width: 0; display: grid; gap: 1px; }
.cl-live b { font-size: 22px; font-weight: 600; line-height: 1.2; }

.cl-staff svg { display: block; height: 72px; width: auto; min-width: 0; flex: 0 1 auto; }   /* smal scherm: de balk krimpt mee */
.cl-close { flex: none; min-width: var(--target-min); min-height: var(--target-min); border-radius: var(--radius-control); border: 1px solid var(--v-separator); background: var(--v-fill); color: inherit; display: grid; place-items: center; }
.cl-keys svg { display: block; width: 100%; height: auto; max-height: 132px; }
.chord-layer .chord-strip { padding-top: 0; }
.chord-layer .chord-card { background: var(--v-fill); border-radius: var(--radius-control); font-size: 15px; }
.chord-layer .chord-card.now { background: var(--v-fill-selected); }
.timeline { position: absolute; z-index: 3; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 3px); height: 3px; background: var(--v-separator); pointer-events: none; }
.timeline i { display: block; height: 100%; width: 0; background: var(--v-text-secondary); }
.timeline.over i { background: var(--v-accent); }
.reader.inrun.runfull .inkbar { bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 9; }
.reader.inrun.runfull .folio { bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
.card-practice { align-self: flex-start; min-height: 44px; }
/* Leesdrill (#158): losse component */
.drill-row { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 10px 10px 0; overflow: hidden; }

const LS = {
  get(k, d) { try { const v = localStorage.getItem('lessenaar.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('lessenaar.' + k, JSON.stringify(v)); } catch { /* opslag geblokkeerd: dan maar per sessie */ } },
};

// Foutmeldingen bewaren (laatste 20), zodat een melding ze meeneemt en de sync ze naar de data-repo zet.
function logError(msg, src) {
  try {
    const l = LS.get('errLog', []) || [];
    l.push({ at: new Date().toISOString(), msg: String(msg || 'onbekende fout').slice(0, 300), src: src || '' });
    LS.set('errLog', l.slice(-20));
  } catch { /* nooit een fout over een fout */ }
}
window.addEventListener('error', e => { if (e && e.message) logError(e.message, e.filename ? e.filename.split('/').pop() + ':' + e.lineno : ''); });
// Vangnet bij de CSP (R3-a2, besluit 8 nov): een overtreding komt in de foutlog en zo met de sync in feedback/fouten.md.
// Elke overtreding (directive + adres) één keer per sessie, zodat een herhaald verzoek de foutlog niet vult.
const cspSeen = new Set();
document.addEventListener('securitypolicyviolation', e => { const k = (e.effectiveDirective || e.violatedDirective || '?') + ' ' + (e.blockedURI || ''); if (cspSeen.has(k)) return; cspSeen.add(k); logError('CSP-overtreding: ' + (e.effectiveDirective || e.violatedDirective || '?') + ' ' + (e.blockedURI || ''), e.sourceFile ? e.sourceFile.split('/').pop() + ':' + (e.lineNumber || 0) : 'csp'); });
window.addEventListener('unhandledrejection', e => { const r = e && e.reason; logError('Promise: ' + ((r && (r.message || String(r))) || 'onbekend')); });

function fmtDur(sec) {
  sec = Math.round(sec || 0);
  if (sec < 60) return sec + ' s';
  const m = Math.round(sec / 60);
  if (m < 60) return m + ' min';
  return Math.floor(m / 60) + ' u ' + String(m % 60).padStart(2, '0') + ' m';
}
function fmtClock(sec) {
  sec = Math.floor(sec || 0);
  const hh = Math.floor(sec / 3600), mm = Math.floor(sec % 3600 / 60), ss = sec % 60;
  return (hh ? hh + ':' + String(mm).padStart(2, '0') : String(mm)) + ':' + String(ss).padStart(2, '0');
}
const fmtInt = n => new Intl.NumberFormat('nl-NL').format(n || 0);
const MONTHS = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
const DAYS = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];
function dayKey(d) { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmtDate(iso) { const d = new Date(iso); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function fmtTime(iso) { const d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function relDay(iso) {
  if (!iso) return '';
  const a = new Date(dayKey(iso)), b = new Date(dayKey(Date.now()));
  const diff = Math.round((b - a) / 86400000);
  if (diff <= 0) return 'vandaag'; if (diff === 1) return 'gisteren'; if (diff < 7) return diff + ' dagen geleden';
  return fmtDate(iso);
}
function weekStart() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }
function isoWithOffset(iso) {
  const d = new Date(iso), off = -d.getTimezoneOffset(), sign = off >= 0 ? '+' : '-', a = Math.abs(off);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}${sign}${p(Math.floor(a / 60))}:${p(a % 60)}`;
}

const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const noteName = n => NOTE_NAMES[n % 12] + (Math.floor(n / 12) - 1);
const TEMPI = [[40, 'Grave'], [46, 'Largo'], [60, 'Larghetto'], [66, 'Adagio'], [76, 'Andante'], [108, 'Moderato'], [120, 'Allegro'], [156, 'Vivace'], [176, 'Presto'], [200, 'Prestissimo']];
function tempoTerm(bpm) { let t = TEMPI[0][1]; for (const [b, n] of TEMPI) if (bpm >= b) t = n; return t; }

/* ---------- één bibliotheek (R3 a1, ADR-1) ----------
   In Safari, de beginscherm-PWA en op de iPhone (geen Web MIDI) schrijft Lessenaar niets: geen IndexedDB, geen sync,
   geen tussenstand. Bij elke start opnieuw beslist (boot), nooit onthouden. De store weigert stil; de knoppen die
   schrijven geven roBlock() met een toast. */
let READ_ONLY = false;
const RO_MSG = 'Alleen lezen in deze browser. Oefenen en bewaren doe je in de Lessenaar-app op je iPad (of in MIDIWeb Browser).';
let roToastAt = 0;
function roBlock() {
  if (!READ_ONLY) return false;
  if (Date.now() - roToastAt > 4000) { roToastAt = Date.now(); toast(RO_MSG); }
  return true;
}

/* =========================================================================
   Opslag. Eén interface, twee implementaties (net als MidiSource in Python).
   ========================================================================= */
const COLLS = ['pieces', 'setlists', 'sessions', 'annotations', 'runs', 'meta'];

class BaseStore {
  constructor() {
    this.data = Object.fromEntries(COLLS.map(c => [c, new Map()]));
    this.listeners = new Set(); this.pending = new Map(); this.inflight = new Map();
    this.downloads = null; this.canUpload = true;
  }
  on(fn) { this.listeners.add(fn); }
  emit(coll) { for (const fn of this.listeners) fn(coll); }
  all(coll) { return [...this.data[coll].values()]; }
  get(coll, id) { return this.data[coll].get(id); }
  // Hoogstens één schrijfactie per document onderweg; de laatste versie wint.
  save(coll, id, body) {
    if (READ_ONLY) return Promise.resolve();   // alleen lezen: ook niet in het geheugen, anders lijkt het bewaard
    const key = coll + '/' + id;
    const doc = { ...body }; delete doc.id;
    this.data[coll].set(id, { ...doc, id });
    this.emit(coll);
    this.pending.set(key, { coll, id, doc });
    if (!this.inflight.has(key)) {
      const job = (async () => {
        while (this.pending.has(key)) {
          const j = this.pending.get(key); this.pending.delete(key);
          try { await this._write(j.coll, j.id, j.doc); }
          catch (e) { reportStoreError(e); }
        }
        this.inflight.delete(key);
      })();
      this.inflight.set(key, job);
    }
    return this.inflight.get(key);
  }
  async remove(coll, id) {
    if (READ_ONLY) return;
    const key = coll + '/' + id;
    this.pending.delete(key);
    if (this.inflight.has(key)) await this.inflight.get(key);
    this.data[coll].delete(id); this.emit(coll);
    try { await this._delete(coll, id); } catch (e) { reportStoreError(e); }
  }
  async fileName(ref) { return null; }   // naam van het opgeslagen bestand, als de opslag die kent
  async builtinBytes(ref) {
    const r = await fetch(ref.path);
    if (!r.ok) throw new Error('Voorbeeldbestand niet gevonden (' + r.status + ')');
    return r.arrayBuffer();
  }
}

class ClaudeStore extends BaseStore {
  constructor(db, assets, downloads) {
    super(); this.kind = 'claude'; this.db = db; this.assets = assets; this.downloads = downloads; this.canUpload = !!assets;
  }
  init() {
    return Promise.all(COLLS.map(c => new Promise(resolve => {
      let first = true;
      const done = () => { if (first) { first = false; resolve(); } };
      setTimeout(done, 8000);
      this.db.collection(c).onSnapshot(snap => {
        const m = new Map();
        for (const d of snap.docs) m.set(d.id, { ...d.data(), id: d.id });
        for (const [key, j] of this.pending) if (j.coll === c) m.set(j.id, { ...j.doc, id: j.id });
        this.data[c] = m; this.emit(c); done();
      }, err => { console.warn('db', c, err); done(); if (err && err.code !== 'revoked') toast('Bibliotheek kon niet synchroniseren (' + (err.code || 'fout') + '). Herlaad de pagina.'); });
    })));
  }
  _write(c, id, doc) { return this.db.collection(c).doc(id).set(doc); }
  _delete(c, id) { return this.db.collection(c).doc(id).delete(); }
  // Hier is geen transactie mogelijk: document voor document, zonder vangnet (een fout stopt het terugzetten).
  async replaceAll(docs, blobs) {
    const refs = new Map();
    for (const b of blobs) refs.set(b.key, await this.putFile(new File([b.buf], b.name, { type: 'application/pdf' })));
    for (const c of COLLS) {
      const keep = new Set();
      for (const d of docs[c] || []) {
        const { id, ...rest } = d.file && d.file.blob ? { ...d, file: refs.get(d.file.blob) } : d;
        await this._write(c, id, rest); keep.add(id);
      }
      for (const old of this.all(c)) if (!keep.has(old.id)) await this._delete(c, old.id);
    }
  }
  async putFile(file) {
    const r = await this.assets.upload(file, { type: 'application/pdf' });
    return { kind: 'asset', id: r.id };
  }
  async fileBytes(ref) {
    if (ref.kind === 'builtin') return this.builtinBytes(ref);
    const r = await fetch('/_blob/' + ref.id);
    if (!r.ok) throw new Error('PDF niet gevonden (' + r.status + ')');
    return r.arrayBuffer();
  }
  async delFile(ref) { if (ref && ref.kind === 'asset' && this.assets) { try { await this.assets.delete(ref.id); } catch (e) { console.warn(e); } } }
  describe() { return 'Je bibliotheek staat in claude.ai, bij dit artefact. Je ziet hem op elk apparaat waarop je bent ingelogd.'; }
}

class LocalStore extends BaseStore {
  constructor() { super(); this.kind = 'local'; this.mem = new Map(); this.idb = null; }
  async init() {
    try {
      this.idb = await new Promise((res, rej) => {
        const r = indexedDB.open('lessenaar', 2);
        r.onupgradeneeded = () => { for (const c of [...COLLS, 'files']) if (!r.result.objectStoreNames.contains(c)) r.result.createObjectStore(c, { keyPath: 'id' }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      });
      // Een nieuwere versie van Lessenaar (andere tab) wil upgraden: verbinding vrijgeven.
      this.idb.onversionchange = () => { this.idb.close(); toast('Lessenaar is bijgewerkt in een ander venster. Herlaad deze pagina.', { sticky: true }); };
      for (const c of COLLS) {
        const rows = await this._tx(c, 'readonly', s => s.getAll());
        this.data[c] = new Map(rows.map(r => [r.id, r]));
      }
    } catch (e) {
      console.warn('IndexedDB niet beschikbaar', e); this.idb = null;
      toast('Deze browser bewaart niets (privévenster?). Wat je nu toevoegt, is weg na herladen.', { sticky: true });
    }
  }
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.idb.transaction(store, mode); const req = fn(tx.objectStore(store));
      tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  }
  async _write(c, id, doc) { if (this.idb) await this._tx(c, 'readwrite', s => s.put({ ...doc, id })); }
  async _delete(c, id) { if (this.idb) await this._tx(c, 'readwrite', s => s.delete(id)); }
  // Terugzetten: de hele bibliotheek vervangen in één transactie. Slaagt pas na `oncomplete`; bij een fout (opslag vol)
  // breekt IndexedDB alles af en blijft de oude data heel. Het geheugen wordt pas daarna bijgewerkt.
  // opts.keepFileIds (Set): de PDF's met deze id's blijven staan, de rest van `files` verdwijnt; zonder opts wordt `files` leeggemaakt.
  async replaceAll(docs, blobs, opts = {}) {
    if (READ_ONLY) throw new Error('alleen lezen in deze browser');
    if (!this.idb) throw new Error('deze browser bewaart niets (privévenster?)');
    await Promise.all([...this.inflight.values()]);
    const oldFileKeys = opts.keepFileIds ? await this._tx('files', 'readonly', s => s.getAllKeys()) : null;
    const refs = new Map(), fileRows = [];
    for (const b of blobs) { const id = uid() + b.key; refs.set(b.key, { kind: 'local', id }); fileRows.push({ id, name: b.name, data: b.buf }); }
    const out = Object.fromEntries(COLLS.map(c => [c, (docs[c] || []).map(d => c === 'pieces' && d.file && d.file.blob ? { ...d, file: refs.get(d.file.blob) } : d)]));
    const names = [...COLLS, 'files'];
    await new Promise((res, rej) => {
      let tx;

        tx = this.idb.transaction(names, 'readwrite');
        tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('het schrijven is afgebroken (waarschijnlijk is de opslag vol)'));
        for (const n of COLLS) tx.objectStore(n).clear();
        if (opts.keepFileIds) { for (const k of oldFileKeys) if (!opts.keepFileIds.has(k)) tx.objectStore('files').delete(k); } else tx.objectStore('files').clear();
        for (const c of COLLS) for (const d of out[c]) tx.objectStore(c).put(d);
        for (const r of fileRows) tx.objectStore('files').put(r);
      } catch (e) { try { tx && tx.abort(); } catch (_) { /* al afgebroken */ } rej(e); }
    });
    for (const c of COLLS) { this.data[c] = new Map(out[c].map(d => [d.id, { ...d }])); this.emit(c); }
  }
  async putFile(file) {
    if (READ_ONLY) throw new Error('alleen lezen in deze browser');
    const id = uid(), buf = await file.arrayBuffer();
    if (this.idb) await this._tx('files', 'readwrite', s => s.put({ id, name: file.name, data: buf }));
    else this.mem.set(id, buf);
    return { kind: 'local', id };
  }
  async fileBytes(ref) {
    if (ref.kind === 'builtin') return this.builtinBytes(ref);
    if (!this.idb) { const b = this.mem.get(ref.id); if (!b) throw new Error('PDF niet gevonden'); return b.slice(0); }
    const row = await this._tx('files', 'readonly', s => s.get(ref.id));
    if (!row) throw new Error('PDF niet gevonden in deze browser');
    return row.data instanceof Blob ? row.data.arrayBuffer() : row.data;
  }
  async fileName(ref) {
    if (!this.idb || !ref || ref.kind !== 'local') return null;
    const row = await this._tx('files', 'readonly', s => s.get(ref.id)); return row && row.name || null;
  }
  async delFile(ref) { if (READ_ONLY) return; if (ref && ref.kind === 'local') { this.mem.delete(ref.id); if (this.idb) await this._tx('files', 'readwrite', s => s.delete(ref.id)); } }
  describe() { return this.idb ? 'Je bibliotheek staat lokaal in deze browser (IndexedDB). Maak af en toe een back-up: browsers kunnen sitegegevens wissen.' : 'Deze browser bewaart niets; alles verdwijnt bij herladen.'; }
}

function reportStoreError(e) {
  console.warn('opslag', e);
  const code = e && e.code;
  if (code === 'quota_exceeded' || (e && e.name === 'QuotaExceededError')) toast('Opslag is vol. Verwijder oude sessies of stukken en probeer opnieuw.', { sticky: true });
  else if (code === 'invalid_argument') toast('Opslaan lukte niet: alleen de eigenaar kan deze bibliotheek wijzigen.');
  else toast('Opslaan lukte niet' + (code ? ' (' + code + ')' : '') + '. Probeer het zo nog eens.');
}

function getPiece(id) {

function sortedSections(p) {
  return (p.sections || []).map((s, i) => ({ ...s, _i: i })).sort((a, b) => (a.page - b.page) || (a._i - b._i));
}
// Welke sectie hoort bij pagina `page` (1-based)? Bij twijfel wint de gekozen sectie,
// dan de sectie die op deze pagina begint, dan de laatst begonnen sectie.
function sectionForPage(p, page, preferId, pageCount) {
  const s = sortedSections(p);
  const ranges = s.map((sec, k) => ({ sec, from: sec.page, to: k + 1 < s.length ? Math.max(sec.page, s[k + 1].page) : (pageCount || 9999) }));
  const cands = ranges.filter(r => r.from <= page && page <= r.to);
  if (!cands.length) return null;
  const pref = cands.find(r => r.sec.id === preferId); if (pref) return pref.sec;
  const starts = cands.find(r => r.from === page); if (starts) return starts.sec;
  return cands[cands.length - 1].sec;
}

/* =========================================================================
   PDF (pdf.js 3.x, worker op de hoofdthread: geen worker-src nodig in de
   CSP, en bladmuziek is licht genoeg). Zelf gehost (ADR-3): vendor/, met
   versie en sha256 in vendor/VERSIONS.md.
   ========================================================================= */
const PDFJS = 'vendor/pdfjs-3.11.174/';
let pdfjsReady = null;
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Kon ' + src.split('/').pop() + ' niet laden')); document.head.append(s); });

function ensurePdfJs() {

    if (!window.pdfjsLib) await loadScript(PDFJS + 'pdf.min.js');
    if (!window.pdfjsWorker) await loadScript(PDFJS + 'pdf.worker.min.js');
    return window.pdfjsLib;
  })().catch(e => { pdfjsReady = null; throw e; });
  return pdfjsReady;
}
async function loadPdf(buf) {
  const lib = await ensurePdfJs();
  return lib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false, disableFontFace: false }).promise;
}
const docCache = new Map(); // pieceId -> Promise<PDFDocumentProxy>
function pieceDoc(p) {
  if (!p.file) return Promise.reject(new Error('Geen PDF gekoppeld'));
  const key = p.id + ':' + JSON.stringify(p.file);
  if (!docCache.has(key)) {
    const pr = store.fileBytes(p.file).then(loadPdf);
    pr.catch(() => docCache.delete(key));
    docCache.set(key, pr);
    if (docCache.size > 4) { const [k, old] = docCache.entries().next().value; docCache.delete(k); old.then(d => { if (d !== R.doc) d.destroy(); }).catch(() => {}); }
  }

}

const thumbs = new Map(); const thumbQueue = []; let thumbBusy = false;

  if (!p.file || p.thumb || thumbs.has(p.id) || thumbQueue.some(x => x.id === p.id)) return;
  thumbQueue.push(p); pumpThumbs();
}
// Eerste pagina als JPEG van ~25 kB: past ruim in het stuk-document, dus de
// bibliotheek hoeft bij openen geen enkele PDF te laden.
async function renderThumb(doc, first = 1) {
  const page = await doc.getPage(Math.min(doc.numPages, Math.max(1, first || 1)));
  const vp1 = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: 300 / vp1.width });
  const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  return c.toDataURL('image/jpeg', 0.78);
}
async function pumpThumbs() {

  while (thumbQueue.length) {
    const p = thumbQueue.shift();
    try {
      const url = await renderThumb(await pieceDoc(p), p.range && p.range.from); thumbs.set(p.id, url);
      const fresh = getPiece(p.id);
      if (fresh && !fresh.example && !fresh.thumb && store.canUpload) savePiece({ ...fresh, thumb: url });
      document.querySelectorAll(`[data-thumb="${CSS.escape(p.id)}"]`).forEach(el => el.replaceChildren(h('img', { src: url, alt: '' })));
    } catch (e) { thumbs.set(p.id, null); console.warn('thumb', p.title, e); }
  }
  thumbBusy = false;
}

// De laatste keer dat je dit stuk speelde: de nieuwste sessie met een blok voor dit stuk (of zelf ingevuld, #79).
function lastTimeOf(pieceId) {
  let best = null;
  for (const r of store.all('runs')) {
    if (!r.startedAt || (best && r.startedAt <= best.at)) continue;
    if (isManual(r)) { if ((r.pieces || []).some(x => x.pieceId === pieceId)) best = { at: r.startedAt, manual: true, min: r.manualMin || 0, attempts: [], next: '' }; continue; }
    const bs = (r.blocks || []).filter(b => b.pieceId === pieceId && !b.skipped && !b.notReached);
    if (!bs.length) continue;
    const nx = (r.next || []).find(n => n.pieceId === pieceId);
    best = { at: r.startedAt, manual: false, sec: bs.reduce((a, b) => a + (b.actualSec || 0), 0), attempts: bs.flatMap(b => b.attempts || []), next: nx ? nx.text : '', loose: !!r.loose,
      verdicts: bs.map(b => b.verdict).filter(v => typeof v === 'boolean'), metro: Math.max(0, ...bs.map(b => b.metro || 0)) };   // #47: oordeel en metronoom per blok
  }
  const old = lastPracticed(pieceId);
  if (old && (!best || old > best.at)) best = { at: old, manual: false, old: true, sec: store.all('sessions').filter(s => s.pieceId === pieceId && s.startedAt === old).reduce((a, s) => a + (s.seconds || 0), 0), attempts: [], next: '' };

async function addFiles(files) {
  if (roBlock() || addOnlyBlock()) return;
  if (!store.canUpload) { toast('Alleen de eigenaar van deze bibliotheek kan stukken toevoegen.'); return; }
  for (const f of files) {
    if (!/pdf$/i.test(f.type) && !/\.pdf$/i.test(f.name)) { toast(f.name + ' is geen PDF.'); continue; }
    if (store.kind === 'claude' && f.size > 20 * 1024 * 1024) {
      toast(`${f.name} is ${(f.size / 1048576).toFixed(1)} MB; claude.ai bewaart tot 20 MB per bestand. Verklein de PDF (bijv. scannen op 300 dpi zwart-wit) en probeer opnieuw.`, { sticky: true });
      continue;
    }
    const busy = toast(f.name + ' toevoegen…', { sticky: true });
    try {
      const buf = await f.arrayBuffer();
      let pages = 0, thumb = null;
      try { const d = await loadPdf(buf.slice(0)); pages = d.numPages; thumb = await renderThumb(d).catch(() => null); d.destroy(); }
      catch (e) { busy.remove(); toast(f.name + ' kan niet als PDF worden gelezen.'); continue; }
      const ref = await store.putFile(new File([buf], f.name, { type: 'application/pdf' }));
      const sha256 = await sha256Hex(buf);
      const id = uid();
      const title = f.name.replace(/\.pdf$/i, '').replace(/[_]+/g, ' ').replace(/\s+-\s+/g, ' – ').trim();
      store.save('pieces', id, { title, composer: '', genre: 'klassiek', status: 'nieuw', key: '', target: null, beats: 4, file: ref, fileName: f.name, ...(sha256 ? { sha256 } : {}), pages, thumb, sections: [], createdAt: nowISO() });
      busy.remove();
      toast(`${title} staat op de plank (${pages} p.).`, { action: { label: 'Secties invullen', run: () => editPiece(id) } });
    } catch (e) {
      busy.remove(); console.warn(e);
      const code = e && e.code;
      toast(code === 'too_large' ? f.name + ' is te groot (max. 20 MB).' : code === 'quota_or_state' ? 'De opslag van dit artefact is vol. Verwijder eerst een stuk.' : 'Toevoegen mislukt: ' + (e.message || code || 'onbekende fout'), { sticky: true });
    }
  }
}

/* ---------- oefensessie ---------- */
function startSession(p) {
  clearInterval(R.tick);
  const t0 = performance.now();
  R.session = { id: uid(), pieceId: p.id, title: p.title, startedAt: nowISO(), t0, seconds: 0, play: 0, notes: 0, pedals: 0, ignored: 0,
    sections: {}, names: {}, tempi: {}, midi: false, lastNote: -1e12, lastAct: t0, paused: !RUN.active, waiting: !RUN.active, autoPaused: false, log: [], elapsed: 0, runId: RUN.active ? RUN.id : null };
  R.tick = setInterval(tickSession, 1000);
}
// Openen om te kijken telt niet: de klok loopt vanaf je eerste noot of een tik op Start.
function startClock() {
  const s = R.session; if (!s || !s.waiting) return;
  s.waiting = false; s.paused = false; s.lastAct = performance.now(); updateTimer();
}
function markActivity() {
  const s = R.session; if (!s) return;
  s.lastAct = performance.now();

}
function tickSession() {
  const s = R.session; if (!s) return;
  const now = performance.now(); s.elapsed = (now - s.t0) / 1000;
  const playing = now - s.lastNote < 2500;
  if (!s.paused && now - s.lastAct > IDLE_MS && !playing) { s.paused = true; s.autoPaused = true; toast('Klok gepauzeerd: vijf minuten geen activiteit. Speel of tik om verder te gaan.'); }
  if (s.paused) { updateTimer(); return; }
  if (document.visibilityState === 'hidden' && now - s.lastNote > 30000) { updateTimer(); return; }
  s.seconds++;
  if (R.sectionId) { s.sections[R.sectionId] = (s.sections[R.sectionId] || 0) + 1; const sec = currentSection(); if (sec) s.names[R.sectionId] = sec.name; }
  if (playing) s.play++;
  if (s.seconds % 60 === 0) persistSession();
  updateTimer();
  if (R.pop === 'sections' && s.seconds % 5 === 0) drawSectionsPop();
}

  if (READ_ONLY) return false;   // niets bewaard, dus ook geen "Sessie opgeslagen"
  const s = R.session; if (!s || s.seconds < 20 || !store.canUpload) return false;
  store.save('sessions', s.id, { pieceId: s.pieceId, title: s.title, startedAt: s.startedAt, endedAt: nowISO(), seconds: s.seconds, play: s.play, notes: s.notes,
    pedals: s.pedals, sections: s.sections, names: s.names, tempi: s.tempi, midi: s.midi, runId: s.runId || null });

}

  const s = R.session; clearInterval(R.tick); R.tick = null;
  if (!s) return;
  s.elapsed = (performance.now() - s.t0) / 1000;
  const saved = persistSession(); R.session = null;
  if (!saved || RUN.active || RUN.quiet) return; // binnen een sessie geen melding per blok
  const msg = `${s.title}: ${fmtDur(s.seconds)}` + (s.midi ? `, waarvan ${fmtDur(s.play)} gespeeld · ${fmtInt(s.notes)} aanslagen` : '') + '.';
  toast((switching ? 'Opgeslagen — ' : 'Sessie opgeslagen — ') + msg, s.log.length ? { ms: 12000, action: { label: 'MIDI-log', run: () => offerDownload(`${dayKey(s.startedAt)}_${fmtTime(s.startedAt).replace(':', '')}_${slug(s.title)}.${store.downloads ? 'txt' : 'jsonl'}`, sessionJsonl(s), 'application/x-ndjson') } } : {});
}
function slug(t) { return (t || 'stuk').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'stuk'; }
function updateTimer() {
  const b = $('#rTimer'); const s = R.session; if (!b) return;
  if (!s) { b.replaceChildren(); return; }
  b.classList.toggle('paused', s.paused && !s.waiting);   // wachten op de eerste noot is geen pauze
  if (s.waiting) { fill(b, icon('play'), h('span', {}, 'Start')); b.title = 'De klok start bij je eerste noot, of tik hier.'; return; }
  fill(b, icon(s.paused ? 'play' : 'pause'), h('span', {}, fmtClock(s.seconds)), s.midi ? h('span', { class: 'played' }, ' ♪ ' + fmtClock(s.play)) : null);
  b.title = s.paused ? 'Gepauzeerd. Klik om verder te gaan.' : 'Oefentijd' + (s.midi ? ' · ♪ = tijd dat je echt speelde' : '') + '. Klik om te pauzeren.';
}

/* ---------- invoer in de lezer ---------- */
function wireReader() {
  const stage = $('#stage');
  let start = null;
  stage.addEventListener('pointerdown', e => {
    if (R.annot && e.target.classList.contains('ink')) return;
    start = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
    markActivity();
  });
  stage.addEventListener('pointerup', e => {
    if (!start || start.id !== e.pointerId) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y, dt = performance.now() - start.t; start = null;
    if (R.pop) { closePops(); refreshReaderChrome(); return; }
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 700) { dx < 0 ? turnNext() : turnPrev(); return; }
    // omhoog vegen = alles tonen (niet in Van papier: daar scrolt de uitleg)
    if (dy < -50 && Math.abs(dy) > Math.abs(dx) * 1.4 && dt < 700 && !R.annot && !paperMode()) { openPanel(); return; }
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12) {
      if (R.annot) return;
      if (panelOpen()) { closePanel(); return; }   // een tik op de muziek haalt alles weer weg
      // alleen de onderste strook opent iets; een tik op de rest van de muziek slaat altijd om (#140)
      if (e.clientY >= window.innerHeight * (1 - PANEL_STRIP)) { openPanel(); return; }
      if (!$('#reader').classList.contains('bars-hidden') && !(RUN.active && !playFull())) hideBars();
      if (e.clientX / window.innerWidth < TURN_BACK) turnPrev(); else turnNext();
    }
  });
  stage.addEventListener('pointercancel', () => { start = null; });
  $('#reader').addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && e.clientY < 70 && !(RUN.active && playFull()) && !panelOpen()) showBars(true); });
  // Wat tijdelijk over het blad komt, zweeft onderaan als glas: de stap bij het begin, de akkoorden en het paneel.
  $('#reader').append(h('div', { id: 'timeline', class: 'timeline', hidden: true, 'aria-hidden': 'true' }, h('i', {})),
    h('div', { id: 'dock', class: 'dock' },
      h('button', { type: 'button', id: 'stepIntro', class: 'step-intro glass', hidden: true, 'aria-live': 'polite', onclick: () => { hideStepIntro(); openPanel(); } }),
      h('div', { id: 'chordLayer', class: 'chord-layer glass', hidden: true }),
      $('#runbar')));
  $('#runbar').classList.add('glass');
  for (const id of ['runbar', 'rbar']) $('#' + id).addEventListener('pointerdown', () => armPanelIdle());
  // een tik op de vraag zelf (naast de knoppen) opent ook het paneel: onderaan is dan geen muziek om op te tikken
  $('#runbar').addEventListener('click', e => { if (RUN.active && playFull() && !RUN.peek && !e.target.closest('button, a')) openPanel(); });
  $('#rReport').before(h('button', { type: 'button', class: 'rbtn', id: 'rChords', 'aria-pressed': 'false', title: 'Toetsenbord: Lessenaar noemt het akkoord, de omkering en de ligging van wat je speelt',
    onclick: () => toggleChords() }, icon('keys'), h('span', { class: 'lab' }, 'Akkoorden')));
  $('#rBack').append(icon('back'), h('span', { class: 'lab' }, 'Bibliotheek'));
  $('#rBack').addEventListener('click', () => (RUN.active ? finishRun(false) : closeReader()));
  $('#rSections').append(icon('list'), h('span', { class: 'lab' }, 'Secties'));
  $('#rSections').addEventListener('click', () => togglePop('sections'));
  $('#rMetro').append(icon('metro'), h('span', { class: 'lab' }, 'Metronoom'));
  $('#rMetro').addEventListener('click', () => togglePop('metro'));
  $('#rInk').append(icon('pen'), h('span', { class: 'lab' }, 'Pen'));
  $('#rInk').addEventListener('click', () => setAnnot(!R.annot));
  $('#rView').append(icon('view'), h('span', { class: 'lab' }, 'Weergave'));
  $('#rView').addEventListener('click', () => togglePop('view'));
  $('#rReport').append(icon('flag'), h('span', { class: 'lab' }, 'Melden'));
  $('#rReport').addEventListener('click', () => { closePops(); reportDialog(); });
  $('#rTimer').addEventListener('click', () => { const s = R.session; if (!s) return; if (s.waiting) { startClock(); return; } s.paused = !s.paused; s.autoPaused = false; s.lastAct = performance.now(); updateTimer(); });

  document.addEventListener('keydown', e => {
    if (!R.open || $('#dlg').open) return;
    if (e.target.matches && e.target.matches('input, textarea, select')) return;
    const k = e.key; markActivity();
    if (k === 'Enter' && RUN.active && RUN.waitStart) { e.preventDefault(); beginBlock(); }
    else if (k === 'Enter' && RUN.active && RUN.done) { e.preventDefault(); nextBlock(); }
    else if (['ArrowRight', 'PageDown', 'ArrowDown', ' '].includes(k)) { e.preventDefault(); turnNext(); }
    else if (['ArrowLeft', 'PageUp', 'ArrowUp'].includes(k)) { e.preventDefault(); turnPrev(); }
    else if (k === 'Home') gotoPage(0);
    else if (k === 'End') gotoPage(R.pageCount - 1);
    else if (k === 'Escape') { if (R.annot) setAnnot(false); else if (R.pop) { closePops(); refreshReaderChrome(); } else if (RUN.active && RUN.peek) closePanel(); else if (RUN.active) finishRun(false); else closeReader(); }
    else if (k === 'm' || k === 'M') { metro.on ? metro.stop() : metro.start(); }
    else if (k === 'p' || k === 'P') $('#rTimer').click();
  });
  let rt = null;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
    if (R.open) { R.canvases.clear(); if (twoUp() && R.half) R.half = false; renderSpread(); }
    else if (ui.view === 'log') renderView();
  }, 150); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && R.open) requestWakeLock(); else persistSession(); });
  window.addEventListener('pagehide', () => persistSession());
}

/* ---------- De iPhone als tweede apparaat (#127) en zijn sessiescherm (#143) ----------
   Rol: deviceRole (PURE) → 'toevoeger' op een iPhone. Die schrijft alleen sessies/ (met -iphone en apparaat) en meldingen;
   nooit back-up, stand.md of repertoire.txt (writeGate). De bibliotheek komt via Herstel van sync en is hier om te lezen.
   READ_ONLY blijft wat het was: Safari op de iPhone (geen Web MIDI) is alleen-lezen, de schil met MIDI is de toevoeger. */
function addOnly() { return writerRole() === 'toevoeger'; }
let addOnlyToastAt = 0;
// Bibliotheek bewerken op het tweede apparaat: het blijft alleen hier en gaat bij het volgende herstel weg. Daarom niet.
function addOnlyBlock() {
  if (!addOnly()) return false;
  if (Date.now() - addOnlyToastAt > 4000) { addOnlyToastAt = Date.now(); toast('Dit is je tweede apparaat: hier speel je, je bibliotheek pas je aan op je iPad.'); }
  return true;
}
// Een herstel vervangt alles. Op het tweede apparaat mag dat pas als elke sessie hier al bij de coach staat.
function addOnlyRestoreBlocked() {
  if (!addOnly()) return false;
  const open = unsentRuns(store.all('runs'), LS.get('syncRuns', [])).length;
  if (LS.get('runDraft', null)) { toast('Rond eerst je onderbroken sessie af (Vandaag); herstellen zou hem wissen.', { sticky: true }); return true; }
  if (open) {
    toast((open === 1 ? 'Eén sessie staat' : open + ' sessies staan') + ' nog niet bij je coach. Synchroniseer eerst; herstellen zou ' + (open === 1 ? 'hem' : 'ze') + ' wissen.', { sticky: true });
    syncNow({ loud: true });
    return true;
  }
  return false;
}
function errLogPath() { const t = deviceTag({ ua: navigator.userAgent, role: writerRole() }); return t ? 'feedback/fouten-' + t + '.md' : 'feedback/fouten.md'; }
function addOnlyStatusText() {
  const sent = LS.get('syncRuns', []).length, open = unsentRuns(store.all('runs'), LS.get('syncRuns', [])).length;
  return 'Tweede apparaat: geen back-up van hier; je iPad houdt de bibliotheek. ' + (open ? (open === 1 ? 'Eén sessie wacht' : open + ' sessies wachten') + ' op de volgende sync.' : sent ? 'Al je sessies staan bij je coach.' : 'Nog geen sessie verstuurd.');
}
// Instellingen → Sync: welke rol dit apparaat heeft. Een iPhone is altijd tweede apparaat; een ander apparaat kan zich
// hier alleen zo zetten (en terug), nooit een iPhone tot schrijver maken.
function deviceRoleLine() {
  const phone = /iPhone/.test(navigator.userAgent);
  return h('label', { class: 'set-line', id: 'roleLine' },
    h('span', {}, 'Tweede apparaat: alleen sessies toevoegen' + (phone ? ' (op een iPhone altijd)' : '')),
    h('input', { type: 'checkbox', id: 'set-addonly', checked: addOnly(), disabled: phone || READ_ONLY, onchange: e => {
      LS.set('deviceRole', e.target.checked ? 'toevoeger' : null); SYNC.newerLib = false; drawSettings();
      toast(e.target.checked ? 'Dit apparaat voegt nu alleen sessies toe; de back-up, de stand en het repertoire schrijft het niet.' : 'Dit apparaat schrijft weer de back-up, de stand en het repertoire.');
    } }));
}

// ---- Het sessiescherm op de iPhone (#143, ontwerp v2): geen blad, de stap is het scherm ----
// Op een iPhone altijd (geen keuze in Weergave); op de iPad blijft de lezer met het blad.
function phoneMode() { return /iPhone/.test(navigator.userAgent); }

function renderPhoneSession(b) {
  const I = instrFor(b), n = I.todo.length, i = Math.min(RUN.stepIdx || 0, n);
  const now = n ? (i < n ? I.todo[i] : (I.done || 'Alle stappen gedaan. Speel verder tot het blok klaar is.')) : (I.steps[0] || '');
  const rest = n ? I.steps.filter(x => x !== now) : I.steps.slice(1);
  const bars = RUN.plan.map((x, k) => {
    const r = RUN.results[k] || {};
    return h('i', { class: k < RUN.idx ? (r.skippedRun ? 'skip' : 'done') : k === RUN.idx ? 'now' : '' });
  });
  $('#reader').classList.add('phone');
  fill($('#spread'), h('div', { class: 'phone-run', id: 'phoneRun' },
    h('div', { class: 'ph-top' },
      h('div', { class: 'ph-bars', 'aria-label': `Blok ${RUN.idx + 1} van ${RUN.plan.length}` }, bars),
      h('span', { class: 'ph-clock', id: 'phClock', 'aria-live': 'off' })),
    h('small', { class: 'ph-kicker' }, `Blok ${RUN.idx + 1} van ${RUN.plan.length} · ${I.kicker}`),
    h('h2', { class: 'ph-title' }, I.title), I.where ? h('p', { class: 'ph-where' }, I.where) : null,
    h('div', { class: 'ph-step' },
      n ? h('small', {}, i < n ? `Stap ${i + 1} van ${n}` : 'Alle stappen gedaan') : null,
      h('b', {}, now),
      n && i < n ? h('button', { type: 'button', class: 'btn brass ph-stepdone', onclick: stepDone }, '✓ Stap gedaan') : null),
    h('div', { id: 'phKeys' }, phoneKeys()),
    scoreChordPart(b),
    rest.length ? h('ol', { class: 'ph-rest' }, rest.map(x => h('li', { class: stepClass(I, x) }, x))) : null));
  updateRunClock(); revealChord($('#phKeys .chord-strip'));
}
function phoneKeys() {
  const ch = stepChords(); if (!ch.length) return null;
  return chordStrip(ch, { now: Math.min(RUN.chordIdx || 0, ch.length - 1), held: [...LIVE.held], ok: RUN.chordOk,
    onPick: k => { RUN.chordIdx = k; RUN.chordOk = false; refreshPhoneKeys(); } });
}
// Meelichten (vanuit renderChordLayer): alleen het toetsenbordje opnieuw, niet het hele scherm.
function refreshPhoneKeys() {

}
function updatePhoneClock(b) {

// De stap staat al groot op het scherm: geen laag erover. De bloktijd begint bij de eerste noot, een tik op ✓ Stap gedaan,
// of na de leestijd (STEP_INTRO_MS), net als op de iPad.
function phoneIntro() {

  if (RUN.waitStart) RUN.introT = setTimeout(endStepIntro, STEP_INTRO_MS);

async function shrinkImage(file, max, quality) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', quality).split(',')[1];
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- Zelftest bij het opstarten (#160, ADR-7) ----------
   Eén keer per nieuwe versie, en op verzoek in Instellingen: opslag, bibliotheek, MIDI, sync en laden.
   Faalt er iets: rood bovenin en één melding per versie via de gewone meldwachtrij. Alles goed: stil.
   Alleen lezen (#111): leest alleen, schrijft niets (geen IndexedDB, geen localStorage, geen melding).
   Een zelftest die zelf crasht, mag het opstarten nooit tegenhouden: alles hier vangt zijn eigen fouten af. */
const SELFTEST_ID = '__zelftest__';
const SELFTEST_MS = 8000;
const selftestWait = (p, ms, onTimeout) => Promise.race([p, new Promise(res => setTimeout(() => res(onTimeout), ms))]);
async function selftestUntilIdle(ms) { for (const end = Date.now() + ms; SYNC.busy && Date.now() < end;) await new Promise(r => setTimeout(r, 200)); }

async function selftestStorage() {
  if (store.kind !== 'local') return { ok: null, why: 'niet van toepassing' };
  if (!store.idb) return { ok: false, why: 'deze browser bewaart niets (privévenster of geen IndexedDB)' };
  const tx = (mode, fn) => store._tx('meta', mode, fn);
  if (READ_ONLY) { await tx('readonly', s => s.count()); return { ok: true, why: 'gelezen; alleen lezen, dus niets geschreven' }; }
  store.data.meta.delete(SELFTEST_ID);   // een restje van een afgebroken zelftest hoort niet in de bibliotheek
  await tx('readwrite', s => s.delete(SELFTEST_ID));
  const before = await tx('readonly', s => s.count()), stamp = uid();
  await tx('readwrite', s => s.put({ id: SELFTEST_ID, stamp }));
  const back = await tx('readonly', s => s.get(SELFTEST_ID));
  await tx('readwrite', s => s.delete(SELFTEST_ID));
  const gone = await tx('readonly', s => s.get(SELFTEST_ID)), after = await tx('readonly', s => s.count());
  if (!back || back.stamp !== stamp) return { ok: false, why: 'testrecord kwam niet terug' };
  if (gone) return { ok: false, why: 'testrecord bleef staan' };
  if (before !== after) return { ok: false, why: `aantal records veranderde (${before} → ${after})` };
  return { ok: true, why: 'schrijven, lezen en wissen gelukt' };
}
async function selftestCounts() {
  let files = null;
  try { if (store.kind === 'local' && store.idb) files = await store._tx('files', 'readonly', s => s.count()); } catch { /* dan niet */ }
  return { pieces: allPieces().filter(p => !p.example).length, runs: store.all('runs').length, files, lib: meta().libraryId || null };
}
async function selftestSyncPart() {
  if (READ_ONLY || !syncCfg()) return { ok: null, why: 'sync staat uit' };
  if (navigator.onLine === false) return { ok: null, why: 'offline' };
  await selftestUntilIdle(20000);   // de sync van het opstarten eerst laten afmaken
  try { await gh(''); }
  // Rood alleen bij een blijvende fout (token of repo); een netwerkhapering of storing bij GitHub probeert de sync vanzelf opnieuw.
  catch (e) { return [401, 403, 404].includes(e.status) ? { ok: false, why: 'data-repo niet bereikbaar: ' + e.message } : { ok: null, why: 'GitHub nu niet bereikbaar' }; }
  if (addOnly()) { const open = unsentRuns(store.all('runs'), LS.get('syncRuns', [])).length; return { ok: true, why: 'tweede apparaat, alleen sessies' + (open ? '; ' + open + ' wacht op de volgende sync' : '; alle sessies bij je coach') }; }   // #127: geen back-up hier
  const bk = LS.get('syncBackup', null) || {};
  if (SYNC.backup.blocked) return { ok: null, why: 'back-up wacht op je keuze (' + (SYNC.backup.reason === 'writer' ? 'een ander apparaat schrijft je bibliotheek' : 'andere bibliotheek in de repo') + ')' };
  if (SYNC.backup.err) return { ok: null, why: 'back-up lukte nu niet (' + SYNC.backup.err + '); de sync probeert opnieuw' };
  if (!bk.okAt && allPieces().some(p => !p.example)) return { ok: null, why: 'nog geen back-up gelukt' };
  return { ok: true, why: bk.okAt ? 'laatste back-up ' + hhmm(bk.okAt) : 'data-repo bereikbaar' };
}
async function selftestLoad() {
  try { await ensurePdfJs(); } catch (e) { return { ok: false, why: 'pdf.js laadt niet: ' + e.message }; }
  // De iOS-schil (ADR-8) en de lokale server hebben geen service worker: alleen ter info, nooit rood.
  let sw = 'zonder service worker';
  try { const r = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (r && r.active) sw = 'service worker actief'; } catch { /* geen */ }

// prev: de tellingen van de vorige start (bij het opstarten vastgelegd), of de bijgehouden stand (op verzoek).
async function selftestRun(prev) {
  await selftestUntilIdle(20000);   // niet tegelijk met de sync van het opstarten in de store meta schrijven
  const one = async (key, fn, timeout) => {
    try { return { key, ...(await selftestWait(fn(), SELFTEST_MS * (key === 'sync' ? 4 : 1), timeout)) }; }
    catch (e) { return { key, ok: false, why: 'fout: ' + String((e && (e.name === 'Error' ? e.message : e.name)) || e).slice(0, 120) }; }
  };
  const parts = [await one('opslag', selftestStorage, { ok: false, why: 'IndexedDB reageert niet' })];
  const cur = await selftestCounts();
  parts.push({ key: 'bibliotheek', ...selftestLibrary(prev, cur) });
  if (!READ_ONLY) LS.set('selftestLib', cur);
  parts.push({ key: 'midi', ...selftestMidi({ available: midiIn.available(), status: midiIn.status }) });
  parts.push(await one('sync', selftestSyncPart, { ok: null, why: 'duurde te lang' }));
  parts.push(await one('laden', selftestLoad, { ok: false, why: 'pdf.js laadt niet (duurde te lang)' }));
  const res = { versie: APP_VERSION, at: Date.now(), parts };
  SELFTEST.last = res;
  if (!READ_ONLY) LS.set('selftest', res);
  return res;
}

// Eén melding per versie, via dezelfde wachtrij als de vlag. Context zonder scherm, stuk of blok.
async function selftestReport(res) {
  if (READ_ONLY || !selftestFailed(res).length || LS.get('selftestSent', null) === APP_VERSION) return;
  const r = { id: 'fb-' + uid(), at: nowISO(), soort: 'kapot', tekst: selftestText(res), foto: false,
    context: { scherm: 'opstarten (zelftest)', versie: APP_VERSION, apparaat: deviceText(), midi: midiIn.status, sync: syncCfg() ? 'aan' : 'uit' } };
  const used = [...(LS.get('fbPaths', []) || []), ...(LS.get('fbQueue', []) || []).map(x => x.doc && x.doc.path)];
  const doc = feedbackDoc(r, used);
  if (!doc || !queueReport({ doc, foto: null, soort: 'kapot' })) return;
  LS.set('selftestSent', APP_VERSION);
  LS.set('fbPaths', [...(LS.get('fbPaths', []) || []), doc.path].slice(-20));
  if (syncCfg()) { await selftestUntilIdle(20000); syncNow(); }
}
async function selftestGo() {
  if (SELFTEST.busy) return SELFTEST.last;
  SELFTEST.busy = true;
  try { const res = await selftestRun(SELFTEST.booted ? LS.get('selftestLib', null) : SELFTEST.prev); SELFTEST.booted = true; selftestShow(res); await selftestReport(res); return res; }
  finally { SELFTEST.busy = false; }
}
// Bij het opstarten (98-boot.js): alleen bij een nieuwe versie. Uit in de browsertests (lessenaar.zelftest = false).
